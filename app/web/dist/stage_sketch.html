<style>
/* base.css - tokens and shared components for the browser demo variants (inlined at build time). */
:root {
  --bg: #ffffff; --surface: #ffffff; --ink: #0e2238; --muted: #56677a; --rule: #cbd9ee;
  --accent: #2a6fd1; --accent-ink: #ffffff; --rulebar: #8793a1; --copied: #2a6fd1; --scratch: #e0702a; --win: #14866d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
/* White background only, for now (a deliberate single look): the page stays white even when the device or viewer is in dark mode.
   The dark palette is kept here for later: re-add it under @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... } }
   and :root[data-theme="dark"] { ... } with: --bg #0c1623; --surface #14243a; --ink #eaf0f7; --muted #9db0c4; --rule #28405c;
   --accent #5b9bf0; --accent-ink #08121f; --rulebar #7f8c9b; --copied #5b9bf0; --scratch #f28a4a; --win #3cc5a4; color-scheme: dark. */
:root { color-scheme: light; }
html { font-size: clamp(15px, 2.5vh, 32px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.25; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2 { font-family: var(--display); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 7.2rem 1fr; gap: .6rem; align-items: center; }
.row > .q { font-weight: 600; font-size: .95rem; }
.row .hint { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
.seg button { flex: 1 1 auto; white-space: nowrap; padding: .42rem .55rem; border: 2px solid var(--rule); background: var(--surface); border-radius: .5rem; font-weight: 600; font-size: .95rem; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .38; cursor: not-allowed; }
.seg button:focus-visible, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--scratch); outline-offset: 2px; }
.chip { border: 2px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .38rem .8rem; font-weight: 600; font-size: .92rem; }
.chip:hover { border-color: var(--accent); }
.go { background: var(--ink); color: var(--bg); border: 0; border-radius: .7rem; padding: .7rem 1.4rem; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.go:hover { filter: brightness(1.15); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: .2rem; margin-right: .35rem; vertical-align: -.1rem; }
.k-rule { --c: var(--rulebar); } .k-copied { --c: var(--copied); } .k-scratch { --c: var(--scratch); }
.lane .t { font-weight: 700; font-size: 1.05rem; } .lane .d { color: var(--muted); font-size: .78rem; }
.lane .pct { font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lane.win .t::after { content: "  winner"; color: var(--win); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.verdict { font-size: .95rem; }
.verdict b { font-family: var(--display); font-size: 1.15rem; }
.note { color: var(--muted); font-size: .8rem; margin-top: .25rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

html { font-size: clamp(12px, min(2vh, 1.15vw), 28px); }
/* "Watch the loop", sketch layout. Left column: the jobs and the progress graph with the learned weights. Centre: the machines and the MDP ring
   (state, action, reward, next state). Right column: the network, its probability graph and the rewards. One orb travels between the boxes. */
.app { height: 100%; box-sizing: border-box; padding-block: .5rem; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .45rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; }
.top h1 { font-size: 1.5rem; line-height: 1; }
#controls { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; }
.go { padding: .38rem .95rem; font-size: 1rem; border-radius: .55rem; } .go:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--rule); border-radius: .55rem; padding: .3rem .7rem; font-weight: 600; font-size: .85rem; } .ghost:disabled { opacity: .4; cursor: not-allowed; }
.seg.small button { padding: .24rem .5rem; font-size: .78rem; }
.sub { color: var(--muted); font-size: .8rem; }
.main { display: grid; grid-template-columns: minmax(0, 16rem) minmax(0, 1fr) minmax(0, 27rem); gap: .5rem; min-height: 0; }
.col { display: flex; flex-direction: column; gap: .5rem; min-height: 0; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: .8rem; padding: .5rem .65rem; display: flex; flex-direction: column; gap: .35rem; min-height: 0; min-width: 0; transition: border-color .3s, background .3s; }
.eyebrow { font-size: .8rem; }
.explainable { cursor: pointer; } .explainable:hover { color: var(--accent); }
.spot { outline: 3px solid var(--accent); outline-offset: 1px; }
/* jobs */
#jobs { flex: 0 0 auto; }
#queue { display: flex; flex-wrap: wrap; gap: .3rem; align-content: flex-start; min-height: calc(3 * clamp(2.6rem, 5.4vh, 3.8rem) + .6rem); }
.qjob { border: 2px solid var(--rule); border-radius: .45rem; background: var(--surface); padding: .1rem .35rem; display: flex; flex-direction: column; justify-content: center; font-size: .75rem; line-height: 1.1; height: clamp(2.6rem, 5.4vh, 3.8rem); min-width: 3.4rem; }
.qjob b { font-size: .9rem; } .qjob span { color: var(--muted); } .qjob.pick { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); } .qjob.fresh { animation: drop .5s ease; }
@keyframes drop { from { transform: translateY(-1rem) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.qempty, .qnext { font-size: .75rem; color: var(--muted); padding: .3rem .2rem; } .qnext { border: 2px dashed var(--rule); border-radius: .45rem; }
.envfoot { display: flex; flex-direction: column; gap: .2rem; font-size: .75rem; color: var(--muted); } .envfoot .seg { flex-wrap: wrap; }
/* machines */
#machinesbox { flex: 0 0 auto; }
#lanes { display: flex; flex-direction: column; gap: .35rem; }
.lanewrap { position: relative; height: clamp(2.4rem, 5.6vh, 3.6rem); } .lanewrap > .mname { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: .75rem; font-weight: 700; color: var(--muted); }
.mlane { position: relative; height: 100%; border: 2px solid var(--ink); border-radius: .5rem; background: var(--surface); margin-left: 4.6rem; }
.mblk { position: absolute; top: .18rem; bottom: .18rem; background: var(--accent); color: var(--accent-ink); border-radius: .3rem; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; box-sizing: border-box; }
.mblk.late { background: var(--scratch); color: #fff; } .mblk.fresh { outline: 3px solid var(--ink); outline-offset: -1px; animation: drop .4s ease; }
.mnow { position: absolute; top: -.25rem; bottom: -.25rem; width: 3px; background: var(--ink); opacity: .5; }
.maxis { margin-left: 4.6rem; display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }
/* the MDP ring */
#ring { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: .25rem; min-height: 0; padding: .2rem; }
.lbox { background: var(--surface); border: 2px solid var(--rule); border-radius: .8rem; padding: .45rem .6rem; display: flex; flex-direction: column; gap: .2rem; min-height: 0; min-width: 0; transition: border-color .3s, background .3s; }
.lbox.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); } .lbox.bad.on { border-color: var(--scratch); background: color-mix(in srgb, var(--scratch) 9%, var(--surface)); }
.lhead { display: flex; align-items: baseline; gap: .4rem; } .lhead b { font-family: var(--display); font-size: 1.1rem; } .lhead .n { color: var(--accent); }
.lval { font-size: 1.15rem; font-weight: 700; line-height: 1.15; } .lbig { font-size: 1.9rem; font-weight: 700; line-height: 1; font-family: var(--display); }
.larr { display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 700; color: var(--rule); transition: color .3s; } .larr.on { color: var(--accent); }
#b-state { grid-area: 1 / 2; } #a-action { grid-area: 1 / 3; align-items: flex-end; justify-content: flex-start; } #b-action { grid-area: 2 / 3; } #a-reward { grid-area: 3 / 3; align-items: flex-start; justify-content: flex-start; } #b-reward { grid-area: 3 / 2; } #a-next { grid-area: 3 / 1; align-items: flex-start; justify-content: flex-end; } #b-next { grid-area: 2 / 1; } #a-state { grid-area: 1 / 1; align-items: flex-end; justify-content: flex-end; }
#mdp { grid-area: 2 / 2; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 2.6rem; font-weight: 700; color: var(--rule); letter-spacing: .08em; }
/* what each ring box was given, step by step (newest highlighted) */
.mlog { flex: 1; min-height: 0; overflow: hidden; font-size: clamp(.82rem, 1.9vh, 1.05rem); line-height: 1.25; display: flex; flex-direction: column; gap: .15rem; }
@keyframes rowin { from { transform: translateY(.7rem); opacity: 0; } to { transform: none; opacity: 1; } }
.mrow.cur { animation: rowin .45s ease; } .mrow.more { font-weight: 700; }
.mrow { display: flex; gap: .4rem; color: var(--muted); } .mrow i { font-style: normal; min-width: 1.1rem; text-align: right; flex: none; } .mrow.cur { color: var(--ink); font-weight: 700; } .mrow.bad, .mrow.bad.cur { color: var(--scratch); }
.mrow > div { min-width: 0; }
.jlist { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .1rem; margin-top: .1rem; }
.jrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); flex: none; } .jrow.more { color: var(--muted); font-weight: 700; }
#v-state { overflow: hidden; }
/* network, probability graph, rewards */
#netbox { flex: 0 0 auto; } #probbox { flex: 1 1 0; min-height: 7rem; } #rewardsbox { flex: 0 0 auto; }
#actorsvg { width: 100%; height: auto; max-height: 11rem; align-self: center; flex: none; }
#dist { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .1rem; }
.dtitle { font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; } .dlegend { font-size: .7rem; color: var(--muted); } .baempty { font-size: .8rem; color: var(--muted); }
#vbars { width: 100%; flex: 1; min-height: 0; }
#vbars .vaxis { stroke: var(--rule); stroke-width: 1.5; } #vbars .vchance { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .5; }
#vbars .vbar { transition: y .5s ease, height .5s ease; } #vbars .vbar.pick { stroke: var(--ink); stroke-width: 2; } #vbars .vlbl { font-size: 10px; font-weight: 700; fill: var(--ink); }
#vbars .vpct { font-size: 10px; font-weight: 700; fill: var(--muted); transition: opacity .3s, y .5s; } #vbars .vpct.pick { fill: var(--accent); }
#vbars .vline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; transition: opacity .4s; } #vbars .vdot { fill: var(--ink); transition: opacity .4s; }
/* critic (actor-critic) or baseline (REINFORCE), inside the network box */
#critic { border-top: 1px dashed var(--rule); padding-top: .3rem; font-size: .72rem; flex: none; }
.cgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .2rem; }
.cchip { border: 2px solid var(--rule); border-radius: .4rem; padding: .05rem .1rem; text-align: center; line-height: 1.05; font-size: .55rem; color: var(--muted); transition: background .25s; }
.cchip b { display: block; font-size: .75rem; color: var(--ink); } .cchip em { font-style: normal; font-size: .55rem; }
.cchip.pos { border-color: color-mix(in srgb, var(--copied) 55%, transparent); } .cchip.neg { border-color: color-mix(in srgb, var(--scratch) 70%, transparent); }
.cout { display: flex; align-items: center; gap: .5rem; margin-top: .25rem; }
.cv { flex: none; border: 3px solid var(--ink); border-radius: 50%; width: 2.9rem; height: 2.9rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-size: .58rem; transition: border-color .3s, border-width .3s; } .cv b { font-size: .9rem; }
.cdelta { font-size: .72rem; font-weight: 700; line-height: 1.2; }
.bbars { display: grid; grid-template-columns: repeat(8, 1fr); gap: .2rem; align-items: end; height: 3.2rem; }
.bb { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: .55rem; color: var(--muted); } .bb i { display: block; width: 100%; background: var(--rulebar); border-radius: .2rem; } .bb.cur i { background: var(--accent); } .bb b { font-size: .6rem; color: var(--ink); }
.lrow { display: grid; grid-template-columns: repeat(8, 1fr); gap: .25rem; }
.lchip { border: 2px solid var(--rule); border-radius: .4rem; text-align: center; font-size: .72rem; line-height: 1.1; padding: .05rem 0 .1rem; transition: background .3s, border-color .3s, transform .2s; }
.lchip small { display: block; color: var(--muted); font-size: .6rem; } .lchip b { font-size: .85rem; } .lchip em { display: block; font-style: normal; font-size: .65rem; font-weight: 700; min-height: .75rem; }
.lchip.empty { opacity: .45; } .lchip.neg { border-color: var(--scratch); color: var(--scratch); } .lchip.zero { border-color: var(--win); color: var(--win); }
.lchip.up { background: color-mix(in srgb, var(--win) 16%, transparent); } .lchip.down { background: color-mix(in srgb, var(--scratch) 16%, transparent); } .lchip.pulse { transform: scale(1.15); }
.lret { font-size: .8rem; font-weight: 700; }
/* progress graph with the learned weights */
#progress { flex: 1; }
#curvebox { position: relative; flex: 1; min-height: 6rem; border: 2px solid var(--rule); border-radius: .5rem; } #curve { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); }
.wrow { display: grid; grid-template-columns: 4.4rem 1fr 3rem; gap: .3rem; align-items: center; font-size: .8rem; margin-bottom: .2rem; }
.wbar { position: relative; height: .85rem; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: .35rem; overflow: hidden; }
.wbar i { position: absolute; top: 0; bottom: 0; background: var(--accent); transition: left .5s, width .5s; } .wbar u { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .4; }
.wrow .wv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; } .wrow.up .wv { color: var(--win); } .wrow.down .wv { color: var(--scratch); }
#msg { font-size: .78rem; color: var(--muted); min-height: 1rem; }
/* the orb */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.token { position: absolute; left: 0; top: 0; padding: .15rem .55rem; border-radius: 1rem; font-size: .8rem; font-weight: 700; color: #fff; background: var(--accent); box-shadow: 0 .2rem .8rem rgba(0, 0, 0, .25); }
.token.action, .token.good { background: var(--win); } .token.job { background: var(--ink); } .token.reward { background: var(--scratch); }
.popup { position: absolute; padding: .2rem .65rem; border-radius: 1rem; font-weight: 700; font-size: 1.1rem; background: var(--surface); border: 2px solid var(--win); color: var(--win); box-shadow: 0 .2rem .8rem rgba(0, 0, 0, .2); }
.popup.bad { border-color: var(--scratch); color: var(--scratch); }
.pulse { fill: var(--accent); }
#actorsvg .edge { stroke: var(--rulebar); stroke-width: 2; fill: none; transition: stroke-width .4s, stroke .4s; } #actorsvg .node { fill: var(--surface); stroke: var(--ink); stroke-width: 2; } #actorsvg .node.soft { fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
#actorsvg .ntxt { font-size: 14px; font-weight: 700; fill: var(--ink); } #actorsvg .small { font-size: 11px; fill: var(--muted); } #actorsvg .wtxt { font-size: 11px; font-weight: 700; fill: var(--ink); }
/* explanation card, same look as the other pages */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(38rem, 96vw); background: var(--surface); color: var(--ink); border-left: 1px solid var(--rule); box-shadow: -.6rem 0 2rem rgba(0, 0, 0, .18); transform: translateX(105%); transition: transform .3s ease; z-index: 20; display: flex; flex-direction: column; font-size: .92rem; }
.drawer.open { transform: none; } .drawer .dhead { display: flex; justify-content: space-between; padding: .6rem .8rem 0; }
.drawer .dhead button { border: 0; background: transparent; font-size: 1rem; padding: .3rem .5rem; border-radius: .4rem; } .drawer .dhead button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.dbody { overflow: auto; padding: .3rem 1.2rem 1.5rem; flex: 1; } .dbody h2 { font-size: 1.35rem; margin: .1rem 0 .6rem; } .dbody p { margin: .4rem 0; line-height: 1.45; }
.sec { border-top: 1px solid var(--rule); padding: .4rem 0; } .sec summary { cursor: pointer; font-weight: 700; font-family: var(--display); padding: .25rem 0; } .sbody { padding-bottom: .3rem; }
.dbody math { font-size: 1.12rem; } .dbody math[display="block"] { margin: .5rem 0; overflow-x: auto; max-width: 100%; }
.dbody code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 0 .25rem; border-radius: .25rem; font-size: .85em; }
.related { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .9rem; padding-top: .7rem; border-top: 1px solid var(--rule); }
@media (max-width: 1000px) { html, body { height: auto; } .app { height: auto; } .main { grid-template-columns: 1fr; } #ring { min-height: 24rem; } }
</style>
<div class="app">
  <div class="top">
    <div><h1 data-ui="stage.heading"></h1><div class="sub" data-ui="stage.tagline"></div></div>
    <div id="controls"></div>
  </div>
  <div class="main">
    <div class="col">
      <section class="panel" id="jobs">
        <div class="eyebrow explainable" data-explain="online" data-ui="box.jobs"></div>
        <div id="queue"></div>
        <div class="envfoot"><span id="modeslot"></span></div>
      </section>
      <section class="panel" id="progress">
        <div class="eyebrow explainable" data-explain="curve" data-ui="box.progress"></div>
        <div id="curvebox"><canvas id="curve"></canvas></div>
        <div id="wbars"></div>
        <div id="msg"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel" id="machinesbox">
        <div class="eyebrow explainable" data-explain="world" data-ui="box.machines"></div>
        <div id="lanes">
          <div class="lanewrap"><span class="mname" data-machine="1"></span><div class="mlane" id="m0"></div></div>
          <div class="lanewrap"><span class="mname" data-machine="2"></span><div class="mlane" id="m1"></div></div>
          <div class="maxis"><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span></div>
        </div>
      </section>
      <div id="ring">
        <div class="lbox" id="b-state" data-explain="state"><div class="lhead"><b><span class="n">1</span> <span data-ui="loop.state"></span></b></div><div class="mlog" id="v-state"></div></div>
        <div class="larr" id="a-action">↘</div>
        <div class="lbox" id="b-action" data-explain="action"><div class="lhead"><b><span class="n">2</span> <span data-ui="loop.action"></span></b></div><div class="mlog" id="v-action"></div></div>
        <div class="larr" id="a-reward">↙</div>
        <div class="lbox" id="b-reward" data-explain="reward"><div class="lhead"><b><span class="n">3</span> <span data-ui="loop.reward"></span></b></div><div class="mlog" id="v-reward"></div></div>
        <div class="larr" id="a-next">↖</div>
        <div class="lbox" id="b-next" data-explain="state"><div class="lhead"><b><span class="n">4</span> <span data-ui="loop.next"></span></b></div><div class="sub" data-ui="loop.sub.next"></div><div class="sub" id="lstep"></div><div class="mlog" id="v-next"></div></div>
        <div class="larr" id="a-state">↗</div>
        <div id="mdp" class="explainable" data-explain="chain" data-ui="loop.mdp"></div>
      </div>
    </div>
    <div class="col">
      <section class="panel" id="netbox">
        <div class="eyebrow explainable" id="agenttitle" data-explain="network"></div>
        <svg id="actorsvg" viewBox="0 0 230 150" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="critic"></div>
      </section>
      <section class="panel" id="probbox">
        <div class="eyebrow explainable" data-explain="policy" data-ui="box.prob"></div>
        <div id="dist"></div>
      </section>
      <section class="panel" id="rewardsbox">
        <div class="eyebrow explainable" data-explain="reward" data-ui="box.rewards"></div>
        <div id="ledger"></div>
      </section>
    </div>
  </div>
</div>
<div id="fx"></div>

<script>
window.RACE_DATA = {"text":{"ui":{"heading":"Watch it learn","tagline":"A toy scheduler with 2 machines and 8 jobs. Press Step to see one decision at a time, or Train to watch the reward improve it.","toy_note":"A toy version of the real problem: 2 machines, no resource limits.","btn.step":"Step","btn.train":"Train","btn.pause":"Pause","btn.test":"Test","btn.reset":"Reset","speed.1":"\u00d71","speed.3":"\u00d73","speed.10":"\u00d710","learner.reinforce":"REINFORCE","learner.ac":"Actor-critic","learner.label":"Learner","panel.world":"The world","panel.queue":"Waiting jobs","panel.machines":"Machines","panel.loop":"The loop","panel.curve":"Cost while learning (lower is better)","panel.weights":"What it learned","panel.test":"Test on new jobs","loop.state":"State","loop.action":"Action","loop.reward":"Reward","loop.next":"Next state","loop.idle":"Press Step to see the first decision.","job.label":"Job {id}","job.detail":"length {p} \u00b7 due {d} \u00b7 weight {w}","curve.random":"Random order","curve.rule":"Best classic rule ({name})","curve.empty":"Press Train to start learning.","episodes":"Episodes: {n}","weights.timeleft":"Time left","weights.length":"Length","weights.importance":"Importance","weights.hint":"A bar to the left means it prefers a small value; to the right, a large value.","test.random":"Random order","test.rule":"Best classic rule ({name})","test.learner":"This learner","test.caption":"Average cost on {n} new job sets (lower is better).","test.note":"In this toy it can beat a single simple rule; the real 10-machine problem is much harder (see the card).","flow.heading":"Watch the loop","flow.tagline":"A job leaves the queue, the network decides, the machine runs it, and the reward teaches the learner. Press Play and follow one decision at a time.","panel.jobqueue":"Job queue","panel.chain":"Markov chain: one episode","panel.ring":"The decision loop","panel.network.ac":"Actor-critic network","panel.network.reinforce":"REINFORCE network","machine.name":"Machine {m}","mode.label":"Jobs","mode.offline":"All known up front","mode.online":"Arriving over time","btn.play":"Play","queue.empty":"No jobs waiting","queue.next":"Next arrival at time {t}","net.timeleft":"Time left","net.length":"Length","net.importance":"Importance","net.score":"Score","net.softmax":"Probabilities","net.actor":"Actor","net.critic":"Critic","net.summary":"Summary of the situation","net.value":"Expected reward from here","net.baseline":"Average reward from this step","chain.start":"Start","chain.node":"Time {t} \u00b7 {n} waiting","chain.action":"Start job {job}","chain.end":"Done \u00b7 cost {cost}","ring.decision":"Decision {k} of {n}","narr.idle":"Press Play to watch the learner schedule 8 jobs, or Step to go one decision at a time.","narr.state":"The learner looks at the situation: which jobs are waiting and how much time each has left.","narr.net":"The network scores every waiting job from its time left, length and importance.","narr.action":"It picks job {job} (probability {pct}%).","narr.place":"Job {job} starts on machine {m}.","narr.reward":"Reward {reward}: {outcome}.","narr.ontime":"the job will finish on time","narr.late":"the job will finish {late} ticks late","narr.next":"The situation changes and the loop repeats.","narr.update":"Episode over, total cost {cost}. The learner updates its weights from the rewards it saw.","test.line":"Test on {n} new job sets: random {random} \u00b7 best rule {rule} {rulecost} \u00b7 this learner {learner}","crit.f0":"Bias (always 1)","crit.f1":"Jobs waiting","crit.f2":"Cost already locked in","crit.f3":"Average spare time","crit.f4":"Tightest time left","crit.f5":"Work still to do","crit.f6":"Other machine ahead by","crit.got":"Got {r} now + expect {n} later, instead of {v}","crit.better":"Better than the critic expected by {d}","crit.worse":"Worse than the critic expected by {d}","base.step":"step {k}","base.note":"Usual reward from this step on: {b}","ledger.title":"Rewards this episode","ledger.return":"Return so far {r}","ledger.empty":"The reward of every decision drops in here.","narr.compare":"The critic had guessed what the reward would be. Now it compares its guess with what happened.","narr.learn":"The rewards have flowed in: weights that led to better-than-expected rewards are strengthened, the others weakened. Watch the old and new values.","stage.heading":"How Reinforcement Learning Works","stage.tagline":"The scheduler learns by trial and error through sequential decision making with a Markov Decision Process (MDP).","panel.env":"Environment","panel.agent":"Learner","panel.ledger":"Rewards this episode","panel.curveweights":"Progress","wire.state":"State","wire.action":"Action","wire.reward":"Reward","loop.step":"Decision {k} of {n}","loop.v.state":"Time {t} \u00b7 {n} jobs waiting","loop.v.action":"Job {job}","loop.v.next":"t={t}","loop.done":"Episode over, cost {cost}","log.state":"t={t}: {n} jobs waiting, {b} of 2 machines active","log.action":"Place J{job} on machine {m} ({pct}%)","log.late":"Penalise J{job}: {r} (ends t={end}, due {due}, {late} late)","log.ontime":"J{job} on time: 0 (ends t={end}, due {due})","log.next":"Next: machine {m} is free at t={b}","log.end":"episode over","log.job":"J{id} \u00b7 length {p} \u00b7 due {d} \u00b7 importance {w}","loop.sub.state":"What the learner sees","loop.sub.action":"The network picks a job","loop.sub.reward":"What that choice earned","loop.sub.next":"Progress one step in time","box.jobs":"Jobs","box.machines":"Machines","box.net":"Network","box.prob":"Probability graph","box.rewards":"Rewards","box.progress":"Progress","loop.mdp":"MDP","narr.gather":"The state is gathered from the jobs that are waiting and the machines that are free.","narr.prob":"The scores become probabilities: one chance for each waiting job.","narr.tick":"Time moves one step forward and the loop starts again.","view.label":"Choice shown as","view.bars":"Bars","view.wheel":"Wheel","btn.stop":"Stop","speed.30":"\u00d730","dist.uniform":"pure chance. Taller bar = more likely to be picked","dist.title":"Chance of picking each job","dist.title.wheel":"The wheel: each slice is a job","weights.title":"Weights (what the network has learned)","related":"Related","back":"\u2190 Back","close":"Close"},"labels":{"chip.network":"The network","chip.chain":"The chain","chip.online":"Online arrivals","chip.world":"The toy world","chip.state":"State","chip.action":"Action","chip.reward":"Reward","chip.policy":"The scoring rule","chip.reinforce":"REINFORCE","chip.actor_critic":"Actor-critic","chip.curve":"Learning curve","chip.weights":"What it learned","chip.test":"The test"},"factors":{},"notes":{},"rules":{},"placements":{},"options":{},"templates":{"loop.state.text":"Time {t} \u00b7 machine {m} is free \u00b7 {n} jobs waiting","loop.action.text":"Start job {job} (picked with probability {pct}%)","loop.reward.late":"{reward} \u00b7 job {job} finishes {late} ticks late (weight {w})","loop.reward.ontime":"0 \u00b7 job {job} finishes on time","loop.next.text":"Time {t} \u00b7 {n} jobs left","loop.next.done":"Episode over \u00b7 total cost {cost}","msg.episode":"Episode {n} finished with cost {cost}. The learner has updated itself from its rewards.","msg.trained":"Training finished after {n} episodes. Press Test to try it on new jobs.","msg.budget":"This learner has used its {n} training episodes. Press Reset to start again.","msg.testing":"Testing on {n} new job sets..."},"topics":{"world":{"kicker":"The toy world","title":"What this demo is, and what it is not","related":["state","action","reward","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Eight jobs wait to be run on two machines. Each job has a length, a deadline and an importance. Every time a machine becomes free, the scheduler picks one waiting job to start. A job that finishes after its deadline costs more the later it is and the more important it is."},{"h":"Formulation","open":true,"text":"A job *j* has length p_{j}, deadline d_{j} and weight w_{j}. Started at time s_{j} it finishes at C_{j} = s_{j} + p_{j} and is late by T_{j} = max(0, C_{j} \u2212 d_{j}). The cost of an episode (one set of 8 jobs) is\n\n{{J}}"},{"h":"How it relates to the research","open":false,"text":"This is the same kind of cost as in the main project, in miniature. The real problem has 10 machines, jobs that need CPU and memory, 100 jobs per instance and jobs that can arrive over time. The scheduler there is a neural network with many more weights, trained for millions of steps. Here the learner has three numbers, so you can watch every part of the loop."}]},"state":{"kicker":"The loop","title":"State: what the learner sees","related":["action","reward","policy"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The state is everything the learner knows when it must decide: the clock, which machine just became free, and which jobs are still waiting with their lengths, deadlines and importance."},{"h":"Formulation","open":false,"text":"At each decision time *t* the state is the list of waiting jobs together with the time left for each: (d_{j} \u2212 t \u2212 p_{j}), which is how long the job could still wait and finish on time. A negative number means it is already going to be late."}]},"action":{"kicker":"The loop","title":"Action: which job to start","related":["state","reward","policy"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The action is the choice of one waiting job to start on the free machine. The learner does not choose the machine: the first machine to become free takes the job, as in the project's priority-learning models."},{"h":"Formulation","open":false,"text":"The learner gives each waiting job a score (see the scoring rule) and picks a job at random in proportion to the scores, so that it keeps exploring while it learns."}]},"reward":{"kicker":"The loop","title":"Reward: what tells it how well it did","related":["state","action","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"After each decision the learner receives a reward: zero if the job will finish on time, and a negative number if it will finish late. The later and the more important the job, the more negative. The learner never sees a list of right answers, only these rewards."},{"h":"Formulation","open":true,"text":"{{reward}}\n\nAdding up the rewards of an episode gives minus the cost J of that episode, so improving the total reward is the same as reducing the cost."},{"h":"Deeper","open":false,"text":"The cost is divided by a constant (10) so that the numbers are easy to read. A job's reward is known as soon as it is started, because its finishing time is then fixed."}]},"policy":{"kicker":"The learner","title":"The scoring rule it learns","related":["weights","reinforce","actor_critic"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The learner scores each waiting job from three numbers: how much time is left before it is due, how long it is, and how important it is. Three weights say how much each number counts. The job with the highest score is the most likely to be picked."},{"h":"Formulation","open":true,"text":"With the three signals gathered in a list \u03c6_{j} (time left, length, importance, each scaled to a similar size) and three weights \u03b8:\n\n{{score}}\n\n{{policy}}\n\nLearning means changing the three weights \u03b8 so that choices with better rewards become more likely."},{"h":"Deeper","open":false,"text":"This is the same idea as Option 2 in the project, where a larger network scores each waiting job from its own features, but with one layer and three weights so that you can read it."}]},"reinforce":{"kicker":"The learner","title":"REINFORCE: learning from the whole episode","related":["policy","actor_critic","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"After each episode, REINFORCE looks at how much total reward came after each decision and compares it with the usual amount at that point. Decisions followed by better-than-usual rewards become more likely; decisions followed by worse-than-usual rewards become less likely."},{"h":"Formulation","open":true,"text":"With the return G_{t} (the rewards from decision t to the end) and a baseline b_{t} (a running average of that return):\n\n{{ret}}\n\n{{reinforce}}"},{"h":"Deeper","open":false,"text":"Plain REINFORCE is noisy because one episode is only one sample; the baseline reduces that noise. Source: Williams (1992)."}]},"actor_critic":{"kicker":"The learner","title":"Actor-critic: a learner with a guess about the future","related":["policy","reinforce","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Actor-critic adds a second small estimator, the critic, that guesses how well things will go from the current situation. The actor (the scoring rule) is then pushed by how much better or worse each decision turned out than the critic expected."},{"h":"Formulation","open":true,"text":"The critic estimates the value of a state from a few summary numbers (how many jobs wait, how many are already doomed to be late, how much slack is left). The advantage of a decision is how much better it went than the critic expected, summed over the rest of the episode with a discount factor:\n\n{{critic}}\n\n{{advantage}}"},{"h":"Deeper","open":false,"text":"The advantage is a generalised advantage estimate (Schulman et al. 2016) with a smoothing factor of 0.9. The critic is trained towards what actually happened."}]},"curve":{"kicker":"The learner","title":"Reading the learning curve","related":["reward","test","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Each dot is the cost of one training episode on a fresh set of jobs, and the line is the average of the last 25 episodes. While it learns, the learner still picks jobs at random in proportion to their scores, so the cost is higher than when it picks its best guess. The grey lines show a random scheduler and the best of five classic rules, measured on new job sets."},{"h":"Deeper","open":false,"text":"The two learners start from the same place (all three weights zero, so every job is equally likely). Switch the learner and train again to compare their curves. Each press of Reset starts both learners again."}]},"weights":{"kicker":"The learner","title":"What it learned","related":["policy","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The three bars are the learned weights. A bar to the left means the learner prefers a small value of that signal; a bar to the right, a large one. After training, the time-left weight is strongly to the left in nearly every run: the learner has discovered that jobs with little time left should go first, which is the idea behind the classic rules."},{"h":"Deeper","open":false,"text":"It also usually prefers short jobs (to the left) and important jobs (to the right). The exact numbers differ from run to run."}]},"test":{"kicker":"The learner","title":"The test on new jobs","related":["curve","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Test uses 200 new sets of jobs that the learner has never trained on, and lets it pick its best-scoring job every time. It is compared with a random scheduler and with the best of five classic rules on the same sets."},{"h":"Deeper","open":false,"text":"In this toy the learner can even beat a single simple rule, because it blends three signals. The real problem, with 10 machines and 100 jobs, is much harder: there the learned schedulers matched the best rules but did not beat them.\n\nUsing new job sets matters for the same reason as in the project: a learner can look good on the jobs it trained on and worse on new ones."}]},"network":{"kicker":"The learner","title":"The network that decides","related":["policy","reinforce","actor_critic","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The three inputs are what the learner knows about one waiting job: how much time is left before it is due, how long it is, and how important it is. Each input is multiplied by a weight (the thickness and colour of the line show the weight: blue is positive, orange is negative) and added into a score. A softmax turns the scores of all waiting jobs into probabilities, and the learner picks a job with those probabilities."},{"h":"Formulation","open":true,"text":"{{score}}\n\n{{policy}}"},{"h":"The critic","open":false,"text":"The critic is a second small estimator. It looks at a summary of the whole situation (how many jobs wait, how many are already doomed to be late, how much time is left) and guesses how much reward is still to come. REINFORCE has no critic: it compares each decision with a plain running average of the reward that usually follows that step."}]},"chain":{"kicker":"The loop","title":"The chain of decisions","related":["state","action","reward","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Each circle is a state: the situation at one decision time. Each arrow is the action taken there, with the reward it earned. Put together, one episode is a chain: state, action, reward, next state, and so on until all the jobs have been scheduled. A Markov chain has this \"the next state depends only on where you are and what you did\" property, which is what lets the learner improve its choices one decision at a time."},{"h":"Deeper","open":false,"text":"Strictly this is a Markov decision process: a Markov chain in which the decisions are made by the learner, not left to chance."}]},"online":{"kicker":"The toy world","title":"Jobs known up front, or arriving over time","related":["world","state"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Up front: all 8 jobs are waiting from time 0. Over time: jobs join the queue at different times, so a machine may have to wait for the next arrival and the learner never knows which jobs are still to come. This is the difference between the offline and online cases in the project."},{"h":"Deeper","open":false,"text":"In the online toy, a job's deadline is counted from its arrival, and the jobs arrive in the first 6 ticks, so the machines are kept busy. Each mode has its own learner, so switching back and forth does not mix their learning."}]}}}};
/* mathml.js - tiny MathML builders shared by the browser demos (the browser renders MathML natively, no library).
   MathML.I identifier, N number, O operator, T text, R row, sub, sup, frac, sum(under, body), ind(...) indicator 1[...], M(...) display block. */
(function () {
  const I = s => `<mi>${s}</mi>`, N = s => `<mn>${s}</mn>`, O = s => `<mo>${s}</mo>`, T = s => `<mtext>${s}</mtext>`;
  const R = (...x) => `<mrow>${x.join("")}</mrow>`;
  const sub = (a, b) => `<msub>${a}${b}</msub>`, sup = (a, b) => `<msup>${a}${b}</msup>`, frac = (a, b) => `<mfrac>${a}${b}</mfrac>`;
  const sum = (u, b) => R(`<munder>${O("∑")}${u}</munder>`, b);
  const ind = (...x) => R(`<mi mathvariant="double-struck">1</mi>`, O("["), ...x, O("]"));
  const M = (...x) => `<math display="block">${x.join("")}</math>`;
  window.MathML = { I, N, O, T, R, sub, sup, frac, sum, ind, M };
})();

/* cards.js - the generic "click anything for an explanation" card engine shared by the browser demos (race page, training demo).
   A page supplies its wording (RACE_DATA.text, parsed from its wording file by app/wording.py), a formulas object (name -> MathML
   html, filled in later by the page) and, optionally, a function that builds a special card (e.g. a racer's numbers).
   Cards.create({text, formulas}) -> { esc, md, fill, topicCard, init, open, close }.
   Text markup: **bold** *italic* `code` a_{j} x^{2} and {{name}} slots (formulas or per-card extras); see the header of the wording file. */
(function () {
  window.Cards = {
    create(cfg) {
      const TX = cfg.text, TP = TX.templates, LB = TX.labels, F = cfg.formulas;
      let slots = {}, root, body, hist = [], build = null;

      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      function inline(s) {
        s = esc(s);
        s = s.replace(/\^\{([^}]*)\}/g, (m, x) => "<sup>" + x.replace(/\*/g, "&#42;") + "</sup>");
        s = s.replace(/([A-Za-zλρσφℓπθγΦΔĈ])_\{([^}]*)\}/g, "<i>$1</i><sub>$2</sub>");
        return s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      const slot = n => (slots[n] != null ? slots[n] : F[n] != null ? F[n] : `<span class="missing">[unknown slot ${n}]</span>`);
      function md(text) {
        return text.split(/\n\s*\n/).map(p => {
          p = p.trim(); if (!p) return "";
          const only = p.match(/^\{\{(\w+)\}\}$/); if (only) return slot(only[1]);
          return "<p>" + inline(p).replace(/\{\{(\w+)\}\}/g, (_, n) => slot(n)) + "</p>";
        }).join("");
      }
      const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));

      // a card from the wording file's "### id" block; extra = per-card slot values
      function topicCard(id, extra) {
        const t = TX.topics[id];
        slots = Object.assign({}, extra);
        const sections = t.sections.map(s => ({ h: s.h, html: md(s.text), open: s.open }));
        if (t.metric) sections.push({ h: TP["factor.section.insore"], html: md(fill(TP["factor.insore"], { metric: t.metric })), open: false });
        return { kicker: t.kicker, title: t.title, sections, related: t.related };
      }

      function render(id, data) {
        const spec = build(id, data || {});
        body.innerHTML = `<div class="eyebrow">${esc(spec.kicker)}</div><h2>${esc(spec.title)}</h2>` +
          spec.sections.map(s => `<details class="sec" ${s.open ? "open" : ""}><summary>${esc(s.h)}</summary><div class="sbody">${s.html}</div></details>`).join("") +
          `<div class="related"><span class="eyebrow">${esc(TX.ui.related)}</span>${(spec.related || []).map(x => `<button type="button" class="chip" data-go="${x}">${esc(LB["chip." + x] || (TX.topics[x] ? TX.topics[x].title : x))}</button>`).join("")}</div>`;
        body.scrollTop = 0;
        root.querySelector(".back").hidden = hist.length < 2;
      }
      function open(id, data) { hist.push({ id, data }); render(id, data); root.classList.add("open"); root.setAttribute("aria-hidden", "false"); }
      function close() { root.classList.remove("open"); root.setAttribute("aria-hidden", "true"); hist = []; }
      function back() { if (hist.length > 1) { hist.pop(); const h = hist[hist.length - 1]; render(h.id, h.data); } }
      // el: the slide-over element; getCtx: data for cards opened from a Related button; buildCard(id, data) -> card spec
      function init(el, getCtx, buildCard) {
        root = el; build = buildCard;
        root.innerHTML = `<div class="dhead"><button type="button" class="back" hidden>${esc(TX.ui.back)}</button><button type="button" class="x" aria-label="${esc(TX.ui.close)}">✕</button></div><div class="dbody"></div>`;
        body = root.querySelector(".dbody");
        root.querySelector(".x").onclick = close; root.querySelector(".back").onclick = back;
        root.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) open(g.dataset.go, getCtx()); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
      }
      return { esc, md, fill, topicCard, init, open, close };
    },
  };
})();

/* training_core.js - the toy scheduling world and its two learners for the "watch it learn" demo. No DOM, no libraries: runs in the
   browser and in Node (tests/test_training_core.js).

   World: 2 machines, 8 jobs known at time 0. Job: length p (1-5), weight w (1-3), deadline d (p .. p+9). Whenever a machine becomes free
   the scheduler picks one waiting job (no idling). A job started at s finishes at C = s + p; its lateness is T = max(0, C - d) and its
   cost is w T^2, so an episode's cost is J = sum w T^2 (the research objective in miniature). The reward of a decision is minus that
   job's cost divided by COST_SCALE, so the episode return is -J / COST_SCALE.

   Policy: score of waiting job j = theta . (time left, length, importance) with time left = (d - t - p) / 10, length = p / 5,
   importance = w / 3; probabilities by softmax over the waiting jobs.
   Learners: "reinforce" (episode return minus a running per-step average) and "actor-critic" (per-decision advantage from a linear
   value estimate). */
(function (root) {
  const MACHINES = 2, JOBS = 8, COST_SCALE = 10, TRAIN_EPISODES = 600, ARRIVAL_SPAN = 6, ONLINE_SLACK = 7;  // budget of the demo: 600 episodes, about 20 s at 30 episodes per second

  function makeRng(seed) {  // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // online = true: jobs arrive over time (arrival a, spread over the first ARRIVAL_SPAN ticks; the deadline is counted from the arrival)
  function makeInstance(rand, online) {
    const jobs = [];
    for (let i = 0; i < JOBS; i++) {
      const p = 1 + Math.floor(rand() * 5), w = 1 + Math.floor(rand() * 3), a = online ? Math.floor(rand() * ARRIVAL_SPAN) : 0, d = a + p + Math.floor(rand() * (online ? ONLINE_SLACK : 10));
      jobs.push({ id: i, p, w, d, a });
    }
    if (online) jobs.sort((x, y) => x.a - y.a).forEach((j, i) => { j.id = i; });  // job numbers follow the arrival order
    return jobs;
  }

  const features = (job, t) => [(job.d - t - job.p) / 10, job.p / 5, job.w / 3];

  // One episode. choose(state) -> index into state.waiting (the jobs that have arrived and are not yet started). A machine with nothing
  // to do waits for the next arrival (an idle gap, recorded in idles). Returns the cost J, every decision, the machine blocks and idles.
  function runEpisode(jobs, choose) {
    const free = new Array(MACHINES).fill(0), left = jobs.map((_, i) => i), steps = [], blocks = [], idles = [];
    let cost = 0;
    while (left.length) {
      let m = 0;
      for (let k = 1; k < MACHINES; k++) if (free[k] < free[m]) m = k;
      let t = free[m];
      let waiting = left.filter(j => jobs[j].a <= t);
      if (!waiting.length) {  // nothing has arrived yet: this machine idles until the next arrival
        const next = Math.min(...left.map(j => jobs[j].a));
        idles.push({ machine: m, start: t, end: next }); free[m] = next; continue;
      }
      const state = { t, machine: m, waiting: waiting.slice(), jobs, free: free.slice(), arrived: jobs.filter(j => j.a <= t).length };
      const k = choose(state), j = waiting[k], job = jobs[j], C = t + job.p, T = Math.max(0, C - job.d), c = job.w * T * T;
      steps.push({ state, k, job: j, start: t, end: C, lateness: T, cost: c, reward: -c / COST_SCALE });
      blocks.push({ job: j, machine: m, start: t, end: C, late: T > 0 });
      cost += c; free[m] = C; left.splice(left.indexOf(j), 1);
    }
    return { cost, steps, blocks, idles, makespan: Math.max(...free) };
  }

  // classic rules, as choosers
