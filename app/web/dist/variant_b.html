<title>Scheduler Race Track</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* base.css - tokens and shared components for the browser demo variants (inlined at build time). */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --ink: #0e2238; --muted: #56677a; --rule: #d6dde6;
  --accent: #2a6fd1; --accent-ink: #ffffff; --rulebar: #8793a1; --copied: #2a6fd1; --scratch: #e0702a; --win: #14866d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1623; --surface: #14243a; --ink: #eaf0f7; --muted: #9db0c4; --rule: #28405c;
  --accent: #5b9bf0; --accent-ink: #08121f; --rulebar: #7f8c9b; --copied: #5b9bf0; --scratch: #f28a4a; --win: #3cc5a4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1623; --surface: #14243a; --ink: #eaf0f7; --muted: #9db0c4; --rule: #28405c;
  --accent: #5b9bf0; --accent-ink: #08121f; --rulebar: #7f8c9b; --copied: #5b9bf0; --scratch: #f28a4a; --win: #3cc5a4; color-scheme: dark; }
html { font-size: clamp(15px, 2.5vh, 32px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.25; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2 { font-family: var(--display); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 7.2rem 1fr; gap: .6rem; align-items: center; }
.row > .q { font-weight: 600; font-size: .95rem; }
.row .hint { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.seg { display: flex; gap: .3rem; min-width: 0; }
.seg button { flex: 1 1 0; min-width: 0; padding: .42rem .3rem; border: 2px solid var(--rule); background: var(--surface); border-radius: .5rem; font-weight: 600; font-size: .95rem; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .38; cursor: not-allowed; }
.seg button:focus-visible, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--scratch); outline-offset: 2px; }
.chip { border: 2px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .38rem .8rem; font-weight: 600; font-size: .92rem; }
.chip:hover { border-color: var(--accent); }
.go { background: var(--ink); color: var(--bg); border: 0; border-radius: .7rem; padding: .7rem 1.4rem; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.go:hover { filter: brightness(1.15); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: .2rem; margin-right: .35rem; vertical-align: -.1rem; }
.k-rule { --c: var(--rulebar); } .k-copied { --c: var(--copied); } .k-scratch { --c: var(--scratch); }
.lane .t { font-weight: 700; font-size: 1.05rem; } .lane .d { color: var(--muted); font-size: .78rem; }
.lane .pct { font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lane.win .t::after { content: "  winner"; color: var(--win); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.verdict { font-size: .95rem; }
.verdict b { font-family: var(--display); font-size: 1.15rem; }
.note { color: var(--muted); font-size: .8rem; margin-top: .25rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Variant B: three step cards across the top, a race track across the bottom, everything on one screen. */
.app { height: 100%; box-sizing: border-box; padding-block: .8rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-rows: auto auto 1fr; gap: .7rem; }
.top h1 { font-size: 1.9rem; }
html { font-size: clamp(14px, 2.1vh, 28px); }
.steps { display: grid; grid-template-columns: 1fr 1.3fr .62fr; gap: .8rem; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: .9rem; padding: .7rem .9rem; display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
.card .row { grid-template-columns: 5.3rem 1fr; }
.card .row .hint { display: none; }
.chips { display: flex; gap: .35rem; flex-wrap: wrap; }
.chips .chip { padding: .3rem .65rem; font-size: .85rem; }
#factors { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem .9rem; }
#factors .row { grid-template-columns: 1fr; gap: .15rem; }
#factors .row > .q { font-size: .82rem; }
#factors .seg button { padding: .28rem .2rem; font-size: .85rem; }
.startcard { justify-content: space-between; }
.startcard .go { width: 100%; padding: .9rem .8rem; }
.track-area { background: var(--surface); border: 1px solid var(--rule); border-radius: .9rem; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .5rem; min-height: 0; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
#lanes { flex: 1; display: flex; flex-direction: column; justify-content: space-around; min-height: 0; }
.lane { display: grid; grid-template-columns: 16rem 1fr; gap: 1rem; align-items: center; }
.road { position: relative; height: 2.1rem; border-radius: 1.05rem; background: color-mix(in srgb, var(--ink) 8%, transparent); margin-right: 1.2rem; }
.road::after { content: ""; position: absolute; right: 0; top: -.2rem; bottom: -.2rem; width: 4px; background: repeating-linear-gradient(var(--ink) 0 .35rem, transparent .35rem .7rem); }
.trail { position: absolute; left: 0; top: .55rem; bottom: .55rem; background: var(--c); opacity: .45; border-radius: .5rem; }
.runner { position: absolute; top: 0; height: 100%; transform: translateX(-100%); background: var(--c); color: #fff; border-radius: 1.05rem; padding: 0 .9rem; display: flex; align-items: center; min-width: 3.4rem; justify-content: center; box-sizing: border-box; }
.runner .pct { color: #fff; font-size: 1.05rem; }
@media (max-width: 900px) { html, body { height: auto; } .app { height: auto; } .steps { grid-template-columns: 1fr; } .lane { grid-template-columns: 1fr; gap: .3rem; } }
</style>
<div class="app">
  <div class="top head"><h1>Which scheduler wins for you?</h1>
    <div class="legend"><span><i style="background:var(--rulebar)"></i>Classic rule</span><span><i style="background:var(--copied)"></i>AI scheduler that copies a rule</span><span><i style="background:var(--scratch)"></i>AI scheduler with its own model</span></div></div>
  <div class="steps">
    <section class="card"><div class="eyebrow">The situation</div><div id="situation" style="display:flex;flex-direction:column;gap:.4rem"></div></section>
    <section class="card"><div class="eyebrow">2 · What matters to you</div><div id="examples" class="chips"></div><div id="factors"></div></section>
    <section class="card startcard"><div class="eyebrow">3 · Go</div><button id="go" class="go" type="button">Start the race</button><div id="verdict" class="verdict" aria-live="polite"></div></section>
  </div>
  <section class="track-area">
    <div class="eyebrow">The race: how close each gets to the best result found (finish line = 100%)</div>
    <div id="lanes"></div>
  </section>
</div>

/* race_core.js - the demo's scoring and race selection in the browser (mirror of app/scoring.py: FACTORS, EXAMPLES,
   race_entries). Needs window.RACE_DATA (written by tools/analysis/make_demo_artifacts.py from the results archive). */
(function () {
  const D = window.RACE_DATA;
  const STEEPNESS = 4.0, NOISE = 0.05;
  const BUSY = { Quiet: "on_rho050", Normal: "on_rho075", Busy: "on_rho095", Overloaded: "on_rho110" };
  const DEADLINES = { Relaxed: "tf02", Medium: "tf05", Tight: "tf08" };
  const LEVELS = { Ignore: 0, Some: 2, "A lot": 5 };

  function presetFor(s) {
    if (s.arrival === "offline") return "off_" + DEADLINES[s.deadlines] + (s.equal ? "_w1" : "");
    return s.tight && BUSY[s.busy] === "on_rho075" ? "on_rho075_tight" : BUSY[s.busy];
  }

  function weights(importance) {  // {factor key: level 0-5} -> weight per metric column
    const w = D.metrics.map(() => 0);
    D.factors.forEach(f => Object.entries(f.metrics).forEach(([m, x]) => { w[D.metrics.indexOf(m)] += (importance[f.key] || 0) * x; }));
    return w;
  }

  function reference(rows, j) {  // best rule on metric j; mean over rules when that is 0 (as scoring.reference_values)
    const v = rows.filter(r => r.family === "H" && r.v[j] != null).map(r => r.v[j]);
    if (!v.length) return null;
    const best = Math.min(...v);
    return best || (v.reduce((a, b) => a + Math.abs(b), 0) / v.length) || 1;
  }

  function run(preset, importance) {
    const rows = (D.presets[preset] || []).map(r => ({ family: r[0], title: r[1], detail: r[2], kind: r[3], model: r[4], v: r[5] }));
    const w = weights(importance);
    const refs = D.metrics.map((_, j) => reference(rows, j));
    const scored = rows.map(r => {
      let s = 0, ok = true;
      w.forEach((x, j) => { if (!x) return; if (r.v[j] == null || !refs[j]) ok = false; else s += x * r.v[j] / refs[j]; });
      return ok ? Object.assign({}, r, { score: s }) : null;
    }).filter(Boolean).sort((a, b) => a.score - b.score);
    if (!scored.length) return { racers: [], note: null };
    const best = scored[0].score, worst = scored[scored.length - 1].score;
    const scale = best > 0 ? best : ((worst - best) || 1);
    scored.forEach(r => { r.percent = 100 * Math.exp(-STEEPNESS * (r.score - best) / scale); });
    const pick = (pred, n) => { const seen = new Set(), out = []; for (const r of scored) { if (pred(r) && !seen.has(r.model)) { seen.add(r.model); out.push(r); if (out.length === n) break; } } return out; };
    const rules = pick(r => r.family === "H", 2), copied = pick(r => r.kind === "copied", 1), scratch = pick(r => r.kind === "scratch", 2);
    let racers = rules.concat(copied, scratch);
    const hasAI = copied.length + scratch.length > 0;
    if (!hasAI) racers = pick(r => r.family === "H", 4);
    racers.sort((a, b) => a.score - b.score);
    let note = null;
    const aiBest = scored.find(r => r.family === "R"), ruleBest = scored.find(r => r.family === "H");
    if (!hasAI) note = "We did not train an AI scheduler for this exact setting, so four classic rules race instead.";
    else if (aiBest) {
      const gap = (aiBest.score - ruleBest.score) / Math.abs(ruleBest.score || 1);
      if (gap >= 0) note = "No AI scheduler beat the best classic rule here. That is the usual result in this project: the AI schedulers mostly learned to copy a good rule and finish close to it.";
      else if (gap > -NOISE) note = "The best AI scheduler is only " + (-gap * 100).toFixed(1) + "% ahead of the best classic rule, which is within the run-to-run noise of this project (gaps under about 5% were not significant).";
    }
    return { racers, note, winner: racers.slice().sort((a, b) => b.percent - a.percent)[0] };
  }

  window.RaceCore = { BUSY, DEADLINES, LEVELS, presetFor, run, data: D };
})();

/* race_ui.js - shared interaction for the browser demo variants: controls, state, race rendering and animation.
   A variant supplies the containers and CSS; RaceUI.init(cfg) wires everything. Uses RaceCore (race_core.js). */
(function () {
  const C = window.RaceCore, D = C.data;
  const state = { arrival: "online", busy: "Busy", tight: false, deadlines: "Medium", equal: false,
                  imp: Object.assign({ late: 0, delay: 0, wait: 0, flow: 0, energy: 0 }, D.examples["Never be late"]) };
  let cfg, running = 0;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const levelName = v => (v === 0 ? "Ignore" : v <= 2 ? "Some" : "A lot");

  function seg(options, value, onPick, disabled) {
    const box = el("div", "seg"); box.setAttribute("role", "radiogroup");
    options.forEach(o => {
      const b = el("button", null, o); b.type = "button"; b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(o === value)); if (disabled && disabled.includes(o)) b.disabled = true;
      b.onclick = () => onPick(o); box.appendChild(b);
    });
    return box;
  }
  function row(label, hint, control) {
    const r = el("div", "row"), q = el("div", "q", label);
    if (hint) q.appendChild(el("span", "hint", hint));
    r.append(q, control); return r;
  }

  function renderControls() {
    const sit = cfg.situation; sit.textContent = "";
    sit.appendChild(row("Jobs arrive", null, seg(["Over time", "Known in advance"], state.arrival === "online" ? "Over time" : "Known in advance",
      o => { state.arrival = o === "Over time" ? "online" : "offline"; changed(); })));
    if (state.arrival === "online") {
      const hints = { Quiet: "about half used", Normal: "about 3/4 used", Busy: "nearly full", Overloaded: "more work than capacity" };
      sit.appendChild(row("Machines", hints[state.busy], seg(Object.keys(C.BUSY), state.busy, o => { state.busy = o; if (o !== "Normal") state.tight = false; changed(); })));
      sit.appendChild(row("Deadlines", state.busy === "Normal" ? null : "tight only tested at Normal",
        seg(["Normal", "Tight"], state.tight ? "Tight" : "Normal", o => { state.tight = o === "Tight"; changed(); }, state.busy === "Normal" ? [] : ["Tight"])));
    } else {
      sit.appendChild(row("Deadlines", null, seg(Object.keys(C.DEADLINES), state.deadlines, o => { state.deadlines = o; changed(); })));
      sit.appendChild(row("Jobs", null, seg(["All equal", "Some matter more"], state.equal ? "All equal" : "Some matter more", o => { state.equal = o === "All equal"; changed(); })));
    }
    cfg.examples.textContent = "";
    Object.keys(D.examples).forEach(name => {
      const b = el("button", "chip", name); b.type = "button";
      b.onclick = () => { Object.keys(state.imp).forEach(k => { state.imp[k] = D.examples[name][k] || 0; }); changed(); };
      cfg.examples.appendChild(b);
    });
    cfg.factors.textContent = "";
    D.factors.forEach(f => {
      cfg.factors.appendChild(row(f.question.split(" (")[0], (f.question.match(/\((.*)\)/) || [])[1] || null,
        seg(["Ignore", "Some", "A lot"], levelName(state.imp[f.key]), o => { state.imp[f.key] = C.LEVELS[o]; changed(); })));
    });
  }

  function lanes(result, fraction) {
    cfg.lanes.textContent = "";
    result.racers.forEach(r => {
      const lane = el("div", "lane k-" + (r.family === "H" ? "rule" : r.kind) + (r === result.winner ? " win" : ""));
      lane.innerHTML = cfg.laneHTML;
      lane.querySelector(".t").textContent = r.title; lane.querySelector(".d").textContent = r.detail;
      const w = r.percent * fraction;
      lane.querySelector(".pct").textContent = Math.round(w) + "%";
      cfg.place(lane, w);
      cfg.lanes.appendChild(lane);
    });
  }

  function verdict(result) {
    cfg.verdict.textContent = "";
    if (!result.winner) { cfg.verdict.textContent = "Nothing to compare for this combination - choose something that matters."; return; }
    const w = result.winner, kind = w.family === "H" ? "classic rule" : "AI scheduler";
    cfg.verdict.append(el("b", null, "Winner: " + w.title), el("span", null, " - " + kind));
    if (result.note) cfg.verdict.appendChild(el("div", "note", result.note));
  }

  function current() { return C.run(C.presetFor(state), state.imp); }
  function changed() { running++; renderControls(); const res = current(); lanes(res, 1); verdict(res); }

  function start() {
    const res = current(), id = ++running; verdict(res);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { lanes(res, 1); return; }
    const t0 = performance.now(), dur = 3200;
    (function frame(now) {
      if (id !== running) return;
      const t = Math.min((now - t0) / dur, 1); lanes(res, 1 - Math.pow(1 - t, 2));
      if (t < 1) requestAnimationFrame(frame);
    })(t0);
  }

  window.RaceUI = { init(c) { cfg = c; renderControls(); c.start.onclick = start; const res = current(); lanes(res, 1); verdict(res); } };
})();

RaceUI.init({
  situation: document.getElementById("situation"), examples: document.getElementById("examples"), factors: document.getElementById("factors"),
  lanes: document.getElementById("lanes"), verdict: document.getElementById("verdict"), start: document.getElementById("go"),
  laneHTML: '<div><div class="t"></div><div class="d"></div></div><div class="road"><div class="trail"></div><div class="runner"><span class="pct"></span></div></div>',
  place(lane, w) { lane.querySelector(".trail").style.width = w + "%"; lane.querySelector(".runner").style.left = w + "%"; }
});
</script>
