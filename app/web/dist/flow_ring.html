<style>
/* base.css - tokens and shared components for the browser demo variants (inlined at build time). */
:root {
  --bg: #ffffff; --surface: #ffffff; --ink: #0e2238; --muted: #56677a; --rule: #cbd9ee;
  --accent: #2a6fd1; --accent-ink: #ffffff; --rulebar: #8793a1; --copied: #2a6fd1; --scratch: #e0702a; --win: #14866d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
/* White background only, for now (a deliberate single look): the page stays white even when the device or viewer is in dark mode.
   The dark palette is kept here for later: re-add it under @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... } }
   and :root[data-theme="dark"] { ... } with: --bg #0c1623; --surface #14243a; --ink #eaf0f7; --muted #9db0c4; --rule #28405c;
   --accent #5b9bf0; --accent-ink #08121f; --rulebar #7f8c9b; --copied #5b9bf0; --scratch #f28a4a; --win #3cc5a4; color-scheme: dark. */
:root { color-scheme: light; }
html { font-size: clamp(15px, 2.5vh, 32px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.25; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2 { font-family: var(--display); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 7.2rem 1fr; gap: .6rem; align-items: center; }
.row > .q { font-weight: 600; font-size: .95rem; }
.row .hint { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
.seg button { flex: 1 1 auto; white-space: nowrap; padding: .42rem .55rem; border: 2px solid var(--rule); background: var(--surface); border-radius: .5rem; font-weight: 600; font-size: .95rem; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .38; cursor: not-allowed; }
.seg button:focus-visible, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--scratch); outline-offset: 2px; }
.chip { border: 2px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .38rem .8rem; font-weight: 600; font-size: .92rem; }
.chip:hover { border-color: var(--accent); }
.go { background: var(--ink); color: var(--bg); border: 0; border-radius: .7rem; padding: .7rem 1.4rem; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.go:hover { filter: brightness(1.15); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: .2rem; margin-right: .35rem; vertical-align: -.1rem; }
.k-rule { --c: var(--rulebar); } .k-copied { --c: var(--copied); } .k-scratch { --c: var(--scratch); }
.lane .t { font-weight: 700; font-size: 1.05rem; } .lane .d { color: var(--muted); font-size: .78rem; }
.lane .pct { font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lane.win .t::after { content: "  winner"; color: var(--win); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.verdict { font-size: .95rem; }
.verdict b { font-family: var(--display); font-size: 1.15rem; }
.note { color: var(--muted); font-size: .8rem; margin-top: .25rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

html { font-size: clamp(13px, 2.1vh, 28px); }
/* "Watch the loop": job queue (left), machines and the centre box (middle), the network and the learning curve (right); one screen. */
.app { height: 100%; box-sizing: border-box; padding-block: .6rem; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; grid-template-rows: auto 1fr; gap: .5rem; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.top h1 { font-size: 1.7rem; } .top .sub { color: var(--muted); font-size: .8rem; max-width: 52rem; }
.main { display: grid; grid-template-columns: 11rem 1fr 24rem; gap: .7rem; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: .8rem; padding: .55rem .7rem; display: flex; flex-direction: column; gap: .4rem; min-height: 0; min-width: 0; }
.mid { display: grid; grid-template-rows: auto 1fr auto; gap: .6rem; min-height: 0; }
.explainable { cursor: pointer; } .explainable:hover { color: var(--accent); }
/* queue */
#qpanel { gap: .4rem; } #queue { flex: 1; display: flex; flex-direction: column; gap: .3rem; overflow: hidden; align-items: stretch; }
.qjob { flex: none; border: 2px solid var(--rule); border-radius: .5rem; background: var(--surface); padding: .1rem .45rem; display: flex; flex-direction: column; justify-content: center; font-size: .72rem; line-height: 1.1; transition: border-color .2s; }
.qjob b { font-size: .85rem; } .qjob span { color: var(--muted); }
.qjob.pick { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.qjob.fresh { animation: drop .5s ease; }
@keyframes drop { from { transform: translateY(-1.2rem) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.qempty, .qnext { font-size: .72rem; color: var(--muted); text-align: center; padding: .3rem 0; }
.qnext { border: 2px dashed var(--rule); border-radius: .5rem; }
/* machines */
#machines { display: flex; gap: .7rem; justify-content: center; }
.mwrap { flex: 1; max-width: 12rem; text-align: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.mbox { position: relative; height: 10.6rem; border: 3px solid var(--ink); border-radius: .4rem; background: var(--surface); margin-bottom: .2rem; overflow: hidden; }
.mblk { position: absolute; left: .25rem; right: .25rem; background: var(--accent); color: var(--accent-ink); border-radius: .3rem; font-size: .7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; box-sizing: border-box; }
.mblk.late { background: var(--scratch); color: #fff; } .mblk.fresh { outline: 3px solid var(--ink); outline-offset: -1px; animation: drop .4s ease; }
.mnow { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink); opacity: .45; }
/* centre */
#centre { border: 2px solid var(--rule); border-radius: .8rem; padding: .5rem; min-height: 0; background: var(--surface); position: relative; }
#centretitle { position: absolute; top: .35rem; left: .7rem; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#narr { font-size: .9rem; min-height: 2.4rem; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink); font-weight: 600; padding: 0 .5rem; }
#controls { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; justify-content: center; }
.go { padding: .42rem 1rem; font-size: 1rem; border-radius: .6rem; } .go:disabled { opacity: .4; cursor: not-allowed; }
.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--rule); border-radius: .6rem; padding: .36rem .8rem; font-weight: 600; font-size: .9rem; } .ghost:disabled { opacity: .4; cursor: not-allowed; }
.seg.small button { padding: .28rem .5rem; font-size: .78rem; }
#msg { font-size: .75rem; color: var(--muted); min-height: 1.2rem; text-align: center; }
/* network */
#netpanel { padding: .5rem .6rem; }
#netsvg { width: 100%; flex: 0 0 auto; height: auto; max-height: 52%; }
#netsvg .edge { stroke: var(--rulebar); stroke-width: 2; fill: none; transition: stroke-width .3s; } #netsvg .edge.thin { stroke-width: 2; } #netsvg .edge.faint { stroke: var(--rule); stroke-width: 1; } #netsvg .edge.faint.show { stroke: var(--accent); }
#netsvg .node { fill: var(--surface); stroke: var(--ink); stroke-width: 2; } #netsvg .node.score, #netsvg .node.soft { fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); } #netsvg .node.value { fill: color-mix(in srgb, var(--win) 16%, var(--surface)); }
#netsvg .ntxt { font-size: 11px; font-weight: 700; fill: var(--ink); } #netsvg .small { font-size: 9px; fill: var(--muted); } #netsvg .bracket { font-size: 10px; font-weight: 700; fill: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
#netsvg .wtxt { font-size: 9px; font-weight: 700; fill: var(--ink); } #netsvg .pbar { fill: var(--rulebar); } #netsvg .pbar.pick { fill: var(--accent); } #netsvg .ptxt { font-size: 8.5px; fill: var(--ink); transform: translateX(0); }
#netsvg .pulse { fill: var(--accent); } #netsvg #cnum { font-size: 11px; font-weight: 700; fill: var(--ink); }
#netsvg.flash .node { stroke: var(--accent); }
#curvebox { flex: 1; position: relative; border: 2px solid var(--rule); border-radius: .6rem; min-height: 0; } #curve { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
.ctitle { display: flex; justify-content: space-between; align-items: baseline; }
/* flying tokens */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
.token { position: absolute; left: 0; top: 0; padding: .15rem .5rem; border-radius: 1rem; font-size: .75rem; font-weight: 700; color: #fff; background: var(--accent); box-shadow: 0 .2rem .8rem rgba(0, 0, 0, .25); }
.token.action { background: var(--win); } .token.job { background: var(--ink); } .token.reward { background: var(--scratch); }
.popup { position: absolute; padding: .2rem .7rem; border-radius: 1rem; font-weight: 700; font-size: 1.1rem; background: var(--surface); border: 2px solid var(--win); color: var(--win); box-shadow: 0 .2rem .8rem rgba(0, 0, 0, .2); }
.popup.bad { border-color: var(--scratch); color: var(--scratch); }
/* explanation card, same look as the other pages */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(38rem, 96vw); background: var(--surface); color: var(--ink); border-left: 1px solid var(--rule); box-shadow: -.6rem 0 2rem rgba(0, 0, 0, .18); transform: translateX(105%); transition: transform .3s ease; z-index: 20; display: flex; flex-direction: column; font-size: .92rem; }
.drawer.open { transform: none; } .drawer .dhead { display: flex; justify-content: space-between; padding: .6rem .8rem 0; }
.drawer .dhead button { border: 0; background: transparent; font-size: 1rem; padding: .3rem .5rem; border-radius: .4rem; } .drawer .dhead button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.dbody { overflow: auto; padding: .3rem 1.2rem 1.5rem; flex: 1; } .dbody h2 { font-size: 1.35rem; margin: .1rem 0 .6rem; } .dbody p { margin: .4rem 0; line-height: 1.45; }
.sec { border-top: 1px solid var(--rule); padding: .4rem 0; } .sec summary { cursor: pointer; font-weight: 700; font-family: var(--display); padding: .25rem 0; } .sbody { padding-bottom: .3rem; }
.dbody math { font-size: 1.12rem; } .dbody math[display="block"] { margin: .5rem 0; overflow-x: auto; max-width: 100%; }
.dbody code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 0 .25rem; border-radius: .25rem; font-size: .85em; }
.related { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .9rem; padding-top: .7rem; border-top: 1px solid var(--rule); }
@media (max-width: 1100px) { .main { grid-template-columns: 9.5rem 1fr 20rem; } }
@media (max-width: 800px) { html, body { height: auto; } .app { height: auto; } .main { grid-template-columns: 1fr; } #centre { min-height: 14rem; } .mbox { height: 8rem; } }
</style>

window.RACE_DATA = {"text":{"ui":{"heading":"Watch it learn","tagline":"A toy scheduler with 2 machines and 8 jobs. Press Step to see one decision at a time, or Train to watch the reward improve it.","toy_note":"A toy version of the real problem: 2 machines, no resource limits.","btn.step":"Step","btn.train":"Train","btn.pause":"Pause","btn.test":"Test","btn.reset":"Reset","speed.1":"\u00d71","speed.3":"\u00d73","speed.10":"\u00d710","learner.reinforce":"REINFORCE","learner.ac":"Actor-critic","learner.label":"Learner","panel.world":"The world","panel.queue":"Waiting jobs","panel.machines":"Machines","panel.loop":"The loop","panel.curve":"Cost while learning (lower is better)","panel.weights":"What it learned","panel.test":"Test on new jobs","loop.state":"State","loop.action":"Action","loop.reward":"Reward","loop.next":"Next state","loop.idle":"Press Step to see the first decision.","job.label":"Job {id}","job.detail":"length {p} \u00b7 due {d} \u00b7 weight {w}","curve.random":"Random order","curve.rule":"Best classic rule ({name})","curve.empty":"Press Train to start learning.","episodes":"Episodes: {n}","weights.timeleft":"Time left","weights.length":"Length","weights.importance":"Importance","weights.hint":"A bar to the left means it prefers a small value; to the right, a large value.","test.random":"Random order","test.rule":"Best classic rule ({name})","test.learner":"This learner","test.caption":"Average cost on {n} new job sets (lower is better).","test.note":"In this toy it can beat a single simple rule; the real 10-machine problem is much harder (see the card).","flow.heading":"Watch the loop","flow.tagline":"A job leaves the queue, the network decides, the machine runs it, and the reward teaches the learner. Press Play and follow one decision at a time.","panel.jobqueue":"Job queue","panel.chain":"Markov chain: one episode","panel.ring":"The decision loop","panel.network.ac":"Actor-critic network","panel.network.reinforce":"REINFORCE network","machine.name":"Machine {m}","mode.label":"Jobs","mode.offline":"All known up front","mode.online":"Arriving over time","btn.play":"Play","queue.empty":"No jobs waiting","queue.next":"Next arrival at time {t}","net.timeleft":"Time left","net.length":"Length","net.importance":"Importance","net.score":"Score","net.softmax":"Probabilities","net.actor":"Actor","net.critic":"Critic","net.summary":"Summary of the situation","net.value":"Expected reward from here","net.baseline":"Average reward from this step","chain.start":"Start","chain.node":"Time {t} \u00b7 {n} waiting","chain.action":"Start job {job}","chain.end":"Done \u00b7 cost {cost}","ring.decision":"Decision {k} of {n}","narr.idle":"Press Play to watch the learner schedule 8 jobs, or Step to go one decision at a time.","narr.state":"The learner looks at the situation: which jobs are waiting and how much time each has left.","narr.net":"The network scores every waiting job from its time left, length and importance.","narr.action":"It picks job {job} (probability {pct}%).","narr.place":"Job {job} starts on machine {m}.","narr.reward":"Reward {reward}: {outcome}.","narr.ontime":"the job will finish on time","narr.late":"the job will finish {late} ticks late","narr.next":"The situation changes and the loop repeats.","narr.update":"Episode over, total cost {cost}. The learner updates its weights from the rewards it saw.","test.line":"Test on {n} new job sets: random {random} \u00b7 best rule {rule} {rulecost} \u00b7 this learner {learner}","related":"Related","back":"\u2190 Back","close":"Close"},"labels":{"chip.network":"The network","chip.chain":"The chain","chip.online":"Online arrivals","chip.world":"The toy world","chip.state":"State","chip.action":"Action","chip.reward":"Reward","chip.policy":"The scoring rule","chip.reinforce":"REINFORCE","chip.actor_critic":"Actor-critic","chip.curve":"Learning curve","chip.weights":"What it learned","chip.test":"The test"},"factors":{},"notes":{},"rules":{},"placements":{},"options":{},"templates":{"loop.state.text":"Time {t} \u00b7 machine {m} is free \u00b7 {n} jobs waiting","loop.action.text":"Start job {job} (picked with probability {pct}%)","loop.reward.late":"{reward} \u00b7 job {job} finishes {late} ticks late (weight {w})","loop.reward.ontime":"0 \u00b7 job {job} finishes on time","loop.next.text":"Time {t} \u00b7 {n} jobs left","loop.next.done":"Episode over \u00b7 total cost {cost}","msg.episode":"Episode {n} finished with cost {cost}. The learner has updated itself from its rewards.","msg.trained":"Training finished after {n} episodes. Press Test to try it on new jobs.","msg.budget":"This learner has used its {n} training episodes. Press Reset to start again.","msg.testing":"Testing on {n} new job sets..."},"topics":{"world":{"kicker":"The toy world","title":"What this demo is, and what it is not","related":["state","action","reward","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Eight jobs wait to be run on two machines. Each job has a length, a deadline and an importance. Every time a machine becomes free, the scheduler picks one waiting job to start. A job that finishes after its deadline costs more the later it is and the more important it is."},{"h":"Formulation","open":true,"text":"A job *j* has length p_{j}, deadline d_{j} and weight w_{j}. Started at time s_{j} it finishes at C_{j} = s_{j} + p_{j} and is late by T_{j} = max(0, C_{j} \u2212 d_{j}). The cost of an episode (one set of 8 jobs) is\n\n{{J}}"},{"h":"How it relates to the research","open":false,"text":"This is the same kind of cost as in the main project, in miniature. The real problem has 10 machines, jobs that need CPU and memory, 100 jobs per instance and jobs that can arrive over time. The scheduler there is a neural network with many more weights, trained for millions of steps. Here the learner has three numbers, so you can watch every part of the loop."}]},"state":{"kicker":"The loop","title":"State: what the learner sees","related":["action","reward","policy"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The state is everything the learner knows when it must decide: the clock, which machine just became free, and which jobs are still waiting with their lengths, deadlines and importance."},{"h":"Formulation","open":false,"text":"At each decision time *t* the state is the list of waiting jobs together with the time left for each: (d_{j} \u2212 t \u2212 p_{j}), which is how long the job could still wait and finish on time. A negative number means it is already going to be late."}]},"action":{"kicker":"The loop","title":"Action: which job to start","related":["state","reward","policy"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The action is the choice of one waiting job to start on the free machine. The learner does not choose the machine: the first machine to become free takes the job, as in the project's priority-learning models."},{"h":"Formulation","open":false,"text":"The learner gives each waiting job a score (see the scoring rule) and picks a job at random in proportion to the scores, so that it keeps exploring while it learns."}]},"reward":{"kicker":"The loop","title":"Reward: what tells it how well it did","related":["state","action","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"After each decision the learner receives a reward: zero if the job will finish on time, and a negative number if it will finish late. The later and the more important the job, the more negative. The learner never sees a list of right answers, only these rewards."},{"h":"Formulation","open":true,"text":"{{reward}}\n\nAdding up the rewards of an episode gives minus the cost J of that episode, so improving the total reward is the same as reducing the cost."},{"h":"Deeper","open":false,"text":"The cost is divided by a constant (10) so that the numbers are easy to read. A job's reward is known as soon as it is started, because its finishing time is then fixed."}]},"policy":{"kicker":"The learner","title":"The scoring rule it learns","related":["weights","reinforce","actor_critic"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The learner scores each waiting job from three numbers: how much time is left before it is due, how long it is, and how important it is. Three weights say how much each number counts. The job with the highest score is the most likely to be picked."},{"h":"Formulation","open":true,"text":"With the three signals gathered in a list \u03c6_{j} (time left, length, importance, each scaled to a similar size) and three weights \u03b8:\n\n{{score}}\n\n{{policy}}\n\nLearning means changing the three weights \u03b8 so that choices with better rewards become more likely."},{"h":"Deeper","open":false,"text":"This is the same idea as Option 2 in the project, where a larger network scores each waiting job from its own features, but with one layer and three weights so that you can read it."}]},"reinforce":{"kicker":"The learner","title":"REINFORCE: learning from the whole episode","related":["policy","actor_critic","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"After each episode, REINFORCE looks at how much total reward came after each decision and compares it with the usual amount at that point. Decisions followed by better-than-usual rewards become more likely; decisions followed by worse-than-usual rewards become less likely."},{"h":"Formulation","open":true,"text":"With the return G_{t} (the rewards from decision t to the end) and a baseline b_{t} (a running average of that return):\n\n{{ret}}\n\n{{reinforce}}"},{"h":"Deeper","open":false,"text":"Plain REINFORCE is noisy because one episode is only one sample; the baseline reduces that noise. Source: Williams (1992)."}]},"actor_critic":{"kicker":"The learner","title":"Actor-critic: a learner with a guess about the future","related":["policy","reinforce","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Actor-critic adds a second small estimator, the critic, that guesses how well things will go from the current situation. The actor (the scoring rule) is then pushed by how much better or worse each decision turned out than the critic expected."},{"h":"Formulation","open":true,"text":"The critic estimates the value of a state from a few summary numbers (how many jobs wait, how many are already doomed to be late, how much slack is left). The advantage of a decision is how much better it went than the critic expected, summed over the rest of the episode with a discount factor:\n\n{{critic}}\n\n{{advantage}}"},{"h":"Deeper","open":false,"text":"The advantage is a generalised advantage estimate (Schulman et al. 2016) with a smoothing factor of 0.9. The critic is trained towards what actually happened."}]},"curve":{"kicker":"The learner","title":"Reading the learning curve","related":["reward","test","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Each dot is the cost of one training episode on a fresh set of jobs, and the line is the average of the last 25 episodes. While it learns, the learner still picks jobs at random in proportion to their scores, so the cost is higher than when it picks its best guess. The grey lines show a random scheduler and the best of five classic rules, measured on new job sets."},{"h":"Deeper","open":false,"text":"The two learners start from the same place (all three weights zero, so every job is equally likely). Switch the learner and train again to compare their curves. Each press of Reset starts both learners again."}]},"weights":{"kicker":"The learner","title":"What it learned","related":["policy","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The three bars are the learned weights. A bar to the left means the learner prefers a small value of that signal; a bar to the right, a large one. After training, the time-left weight is strongly to the left in nearly every run: the learner has discovered that jobs with little time left should go first, which is the idea behind the classic rules."},{"h":"Deeper","open":false,"text":"It also usually prefers short jobs (to the left) and important jobs (to the right). The exact numbers differ from run to run."}]},"test":{"kicker":"The learner","title":"The test on new jobs","related":["curve","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Test uses 200 new sets of jobs that the learner has never trained on, and lets it pick its best-scoring job every time. It is compared with a random scheduler and with the best of five classic rules on the same sets."},{"h":"Deeper","open":false,"text":"In this toy the learner can even beat a single simple rule, because it blends three signals. The real problem, with 10 machines and 100 jobs, is much harder: there the learned schedulers matched the best rules but did not beat them.\n\nUsing new job sets matters for the same reason as in the project: a learner can look good on the jobs it trained on and worse on new ones."}]},"network":{"kicker":"The learner","title":"The network that decides","related":["policy","reinforce","actor_critic","weights"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The three inputs are what the learner knows about one waiting job: how much time is left before it is due, how long it is, and how important it is. Each input is multiplied by a weight (the thickness and colour of the line show the weight: blue is positive, orange is negative) and added into a score. A softmax turns the scores of all waiting jobs into probabilities, and the learner picks a job with those probabilities."},{"h":"Formulation","open":true,"text":"{{score}}\n\n{{policy}}"},{"h":"The critic","open":false,"text":"The critic is a second small estimator. It looks at a summary of the whole situation (how many jobs wait, how many are already doomed to be late, how much time is left) and guesses how much reward is still to come. REINFORCE has no critic: it compares each decision with a plain running average of the reward that usually follows that step."}]},"chain":{"kicker":"The loop","title":"The chain of decisions","related":["state","action","reward","curve"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Each circle is a state: the situation at one decision time. Each arrow is the action taken there, with the reward it earned. Put together, one episode is a chain: state, action, reward, next state, and so on until all the jobs have been scheduled. A Markov chain has this \"the next state depends only on where you are and what you did\" property, which is what lets the learner improve its choices one decision at a time."},{"h":"Deeper","open":false,"text":"Strictly this is a Markov decision process: a Markov chain in which the decisions are made by the learner, not left to chance."}]},"online":{"kicker":"The toy world","title":"Jobs known up front, or arriving over time","related":["world","state"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Up front: all 8 jobs are waiting from time 0. Over time: jobs join the queue at different times, so a machine may have to wait for the next arrival and the learner never knows which jobs are still to come. This is the difference between the offline and online cases in the project."},{"h":"Deeper","open":false,"text":"In the online toy, a job's deadline is counted from its arrival, and the jobs arrive in the first 6 ticks, so the machines are kept busy. Each mode has its own learner, so switching back and forth does not mix their learning."}]}}}};
/* mathml.js - tiny MathML builders shared by the browser demos (the browser renders MathML natively, no library).
   MathML.I identifier, N number, O operator, T text, R row, sub, sup, frac, sum(under, body), ind(...) indicator 1[...], M(...) display block. */
(function () {
  const I = s => `<mi>${s}</mi>`, N = s => `<mn>${s}</mn>`, O = s => `<mo>${s}</mo>`, T = s => `<mtext>${s}</mtext>`;
  const R = (...x) => `<mrow>${x.join("")}</mrow>`;
  const sub = (a, b) => `<msub>${a}${b}</msub>`, sup = (a, b) => `<msup>${a}${b}</msup>`, frac = (a, b) => `<mfrac>${a}${b}</mfrac>`;
  const sum = (u, b) => R(`<munder>${O("∑")}${u}</munder>`, b);
  const ind = (...x) => R(`<mi mathvariant="double-struck">1</mi>`, O("["), ...x, O("]"));
  const M = (...x) => `<math display="block">${x.join("")}</math>`;
  window.MathML = { I, N, O, T, R, sub, sup, frac, sum, ind, M };
})();

/* cards.js - the generic "click anything for an explanation" card engine shared by the browser demos (race page, training demo).
   A page supplies its wording (RACE_DATA.text, parsed from its wording file by app/wording.py), a formulas object (name -> MathML
   html, filled in later by the page) and, optionally, a function that builds a special card (e.g. a racer's numbers).
   Cards.create({text, formulas}) -> { esc, md, fill, topicCard, init, open, close }.
   Text markup: **bold** *italic* `code` a_{j} x^{2} and {{name}} slots (formulas or per-card extras); see the header of the wording file. */
(function () {
  window.Cards = {
    create(cfg) {
      const TX = cfg.text, TP = TX.templates, LB = TX.labels, F = cfg.formulas;
      let slots = {}, root, body, hist = [], build = null;

      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      function inline(s) {
        s = esc(s);
        s = s.replace(/\^\{([^}]*)\}/g, (m, x) => "<sup>" + x.replace(/\*/g, "&#42;") + "</sup>");
        s = s.replace(/([A-Za-zλρσφℓπθγΦΔĈ])_\{([^}]*)\}/g, "<i>$1</i><sub>$2</sub>");
        return s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      const slot = n => (slots[n] != null ? slots[n] : F[n] != null ? F[n] : `<span class="missing">[unknown slot ${n}]</span>`);
      function md(text) {
        return text.split(/\n\s*\n/).map(p => {
          p = p.trim(); if (!p) return "";
          const only = p.match(/^\{\{(\w+)\}\}$/); if (only) return slot(only[1]);
          return "<p>" + inline(p).replace(/\{\{(\w+)\}\}/g, (_, n) => slot(n)) + "</p>";
        }).join("");
      }
      const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));

      // a card from the wording file's "### id" block; extra = per-card slot values
      function topicCard(id, extra) {
        const t = TX.topics[id];
        slots = Object.assign({}, extra);
        const sections = t.sections.map(s => ({ h: s.h, html: md(s.text), open: s.open }));
        if (t.metric) sections.push({ h: TP["factor.section.insore"], html: md(fill(TP["factor.insore"], { metric: t.metric })), open: false });
        return { kicker: t.kicker, title: t.title, sections, related: t.related };
      }

      function render(id, data) {
        const spec = build(id, data || {});
        body.innerHTML = `<div class="eyebrow">${esc(spec.kicker)}</div><h2>${esc(spec.title)}</h2>` +
          spec.sections.map(s => `<details class="sec" ${s.open ? "open" : ""}><summary>${esc(s.h)}</summary><div class="sbody">${s.html}</div></details>`).join("") +
          `<div class="related"><span class="eyebrow">${esc(TX.ui.related)}</span>${(spec.related || []).map(x => `<button type="button" class="chip" data-go="${x}">${esc(LB["chip." + x] || (TX.topics[x] ? TX.topics[x].title : x))}</button>`).join("")}</div>`;
        body.scrollTop = 0;
        root.querySelector(".back").hidden = hist.length < 2;
      }
      function open(id, data) { hist.push({ id, data }); render(id, data); root.classList.add("open"); root.setAttribute("aria-hidden", "false"); }
      function close() { root.classList.remove("open"); root.setAttribute("aria-hidden", "true"); hist = []; }
      function back() { if (hist.length > 1) { hist.pop(); const h = hist[hist.length - 1]; render(h.id, h.data); } }
      // el: the slide-over element; getCtx: data for cards opened from a Related button; buildCard(id, data) -> card spec
      function init(el, getCtx, buildCard) {
        root = el; build = buildCard;
        root.innerHTML = `<div class="dhead"><button type="button" class="back" hidden>${esc(TX.ui.back)}</button><button type="button" class="x" aria-label="${esc(TX.ui.close)}">✕</button></div><div class="dbody"></div>`;
        body = root.querySelector(".dbody");
        root.querySelector(".x").onclick = close; root.querySelector(".back").onclick = back;
        root.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) open(g.dataset.go, getCtx()); });
        document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
      }
      return { esc, md, fill, topicCard, init, open, close };
    },
  };
})();

/* training_core.js - the toy scheduling world and its two learners for the "watch it learn" demo. No DOM, no libraries: runs in the
   browser and in Node (tests/test_training_core.js).

   World: 2 machines, 8 jobs known at time 0. Job: length p (1-5), weight w (1-3), deadline d (p .. p+9). Whenever a machine becomes free
   the scheduler picks one waiting job (no idling). A job started at s finishes at C = s + p; its lateness is T = max(0, C - d) and its
   cost is w T^2, so an episode's cost is J = sum w T^2 (the research objective in miniature). The reward of a decision is minus that
   job's cost divided by COST_SCALE, so the episode return is -J / COST_SCALE.

   Policy: score of waiting job j = theta . (time left, length, importance) with time left = (d - t - p) / 10, length = p / 5,
   importance = w / 3; probabilities by softmax over the waiting jobs.
   Learners: "reinforce" (episode return minus a running per-step average) and "actor-critic" (per-decision advantage from a linear
   value estimate). */
(function (root) {
  const MACHINES = 2, JOBS = 8, COST_SCALE = 10, TRAIN_EPISODES = 600, ARRIVAL_SPAN = 6, ONLINE_SLACK = 7;  // budget of the demo: 600 episodes, about 20 s at 30 episodes per second

  function makeRng(seed) {  // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // online = true: jobs arrive over time (arrival a, spread over the first ARRIVAL_SPAN ticks; the deadline is counted from the arrival)
  function makeInstance(rand, online) {
    const jobs = [];
    for (let i = 0; i < JOBS; i++) {
      const p = 1 + Math.floor(rand() * 5), w = 1 + Math.floor(rand() * 3), a = online ? Math.floor(rand() * ARRIVAL_SPAN) : 0, d = a + p + Math.floor(rand() * (online ? ONLINE_SLACK : 10));
      jobs.push({ id: i, p, w, d, a });
    }
    if (online) jobs.sort((x, y) => x.a - y.a).forEach((j, i) => { j.id = i; });  // job numbers follow the arrival order
    return jobs;
  }

  const features = (job, t) => [(job.d - t - job.p) / 10, job.p / 5, job.w / 3];

  // One episode. choose(state) -> index into state.waiting (the jobs that have arrived and are not yet started). A machine with nothing
  // to do waits for the next arrival (an idle gap, recorded in idles). Returns the cost J, every decision, the machine blocks and idles.
  function runEpisode(jobs, choose) {
    const free = new Array(MACHINES).fill(0), left = jobs.map((_, i) => i), steps = [], blocks = [], idles = [];
    let cost = 0;
    while (left.length) {
      let m = 0;
      for (let k = 1; k < MACHINES; k++) if (free[k] < free[m]) m = k;
      let t = free[m];
      let waiting = left.filter(j => jobs[j].a <= t);
      if (!waiting.length) {  // nothing has arrived yet: this machine idles until the next arrival
        const next = Math.min(...left.map(j => jobs[j].a));
        idles.push({ machine: m, start: t, end: next }); free[m] = next; continue;
      }
      const state = { t, machine: m, waiting: waiting.slice(), jobs, free: free.slice(), arrived: jobs.filter(j => j.a <= t).length };
      const k = choose(state), j = waiting[k], job = jobs[j], C = t + job.p, T = Math.max(0, C - job.d), c = job.w * T * T;
      steps.push({ state, k, job: j, start: t, end: C, lateness: T, cost: c, reward: -c / COST_SCALE });
      blocks.push({ job: j, machine: m, start: t, end: C, late: T > 0 });
      cost += c; free[m] = C; left.splice(left.indexOf(j), 1);
    }
    return { cost, steps, blocks, idles, makespan: Math.max(...free) };
  }

  // classic rules, as choosers
  const argBest = (state, score) => { let best = 0, bs = Infinity; state.waiting.forEach((j, k) => { const s = score(state.jobs[j], state.t); if (s < bs) { bs = s; best = k; } }); return best; };
  const RULES = {
    EDF: s => argBest(s, j => j.d), LST: s => argBest(s, (j, t) => j.d - t - j.p), SPT: s => argBest(s, j => j.p),
    WSPT: s => argBest(s, j => -j.w / j.p), WEDF: s => argBest(s, (j, t) => (j.d - t) / j.w),
  };
  const randomChooser = rand => state => Math.floor(rand() * state.waiting.length);

  function softmax(z) {
    const m = Math.max(...z), e = z.map(x => Math.exp(x - m)), s = e.reduce((a, b) => a + b, 0);
    return e.map(x => x / s);
  }
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

  // summary features of a state for the critic (what a person would look at to guess how bad things will get)
  function stateFeatures(state) {
    const left = state.waiting.map(j => (state.jobs[j].d - state.t - state.jobs[j].p) / 10), n = state.waiting.length;
    const work = state.waiting.reduce((s, j) => s + state.jobs[j].p, 0);
    const doomed = state.waiting.reduce((s, j, k) => s + state.jobs[j].w * Math.pow(Math.max(0, -left[k]), 2), 0);  // already late if started now
    const spare = left.reduce((s, x) => s + Math.max(0, x), 0) / n;
    const other = Math.max(...state.free) - state.t;  // how far ahead the other machine is
    return [1, n / JOBS, doomed, spare, Math.min(...left), work / 24, other / 5];
  }

  function createLearner(kind, seed, opts) {
    const o = Object.assign({ actorRate: 0.01, criticRate: 0.02, lambda: 0.9 }, opts);
    const rand = makeRng(seed), theta = [0, 0, 0], critic = new Array(7).fill(0), base = new Array(JOBS).fill(0);
    let episodes = 0;
    const probs = state => softmax(state.waiting.map(j => dot(theta, features(state.jobs[j], state.t))));
    const learner = {
      kind, theta, critic, probs, rand,
      value: state => dot(critic, stateFeatures(state)),
      baseline: t => base[Math.min(t, JOBS - 1)],  // REINFORCE's running average of the reward from decision t onwards (for display)
      greedy: state => { const p = probs(state); let b = 0; p.forEach((x, k) => { if (x > p[b]) b = k; }); return b; },
      sample: state => { const p = probs(state); let u = rand(), k = 0; while (k < p.length - 1 && u > p[k]) { u -= p[k]; k++; } return k; },
      get episodes() { return episodes; },
      // one training episode on a fresh job set; returns the episode record
      train(jobs) { const ep = runEpisode(jobs, learner.sample); learner.update(ep); return ep; },
      // learn from a finished episode (the demo's Step mode plays an episode out decision by decision, then calls this)
      update(ep) {
        const jobs = ep.steps[0].state.jobs;
        const grads = ep.steps.map(st => {  // gradient of log pi(action): phi_a - sum_j pi_j phi_j
          const p = probs(st.state), phis = st.state.waiting.map(j => features(jobs[j], st.state.t));
          const mean = [0, 1, 2].map(i => phis.reduce((s, f, k) => s + p[k] * f[i], 0));
          return phis[st.k].map((x, i) => x - mean[i]);
        });
        if (kind === "reinforce") {
          let g = 0;
          for (let t = ep.steps.length - 1; t >= 0; t--) {  // return from step t, minus the running average return from step t
            g += ep.steps[t].reward;
            const adv = g - base[t];
            base[t] += 0.05 * (g - base[t]);
            for (let i = 0; i < 3; i++) theta[i] += o.actorRate * adv * grads[t][i];
          }
        } else {
          // actor-critic: the critic estimates how good each situation is; the advantage of a decision is how much better it went than
          // the critic expected (generalised advantage estimation over the episode); the critic is trained towards what happened
          const n = ep.steps.length, psis = ep.steps.map(st => stateFeatures(st.state)), vs = psis.map(ps => dot(critic, ps));
          let adv = 0;
          for (let t = n - 1; t >= 0; t--) {
            const delta = ep.steps[t].reward + (t + 1 < n ? vs[t + 1] : 0) - vs[t];
            adv = delta + o.lambda * adv;
            for (let i = 0; i < 7; i++) critic[i] += o.criticRate * adv * psis[t][i];
            for (let i = 0; i < 3; i++) theta[i] += o.actorRate * adv * grads[t][i];
          }
        }
        episodes++;
      },
    };
    return learner;
  }

  // mean cost of a chooser over a list of job sets
  const meanCost = (sets, choose) => sets.reduce((s, jobs) => s + runEpisode(jobs, choose).cost, 0) / sets.length;
  const testSets = (n, seed, online) => { const r = makeRng(seed); return Array.from({ length: n }, () => makeInstance(r, online)); };

  const core = { MACHINES, JOBS, COST_SCALE, TRAIN_EPISODES, makeRng, makeInstance, features, runEpisode, RULES, randomChooser, createLearner, meanCost, testSets, softmax, stateFeatures };
  if (typeof module !== "undefined" && module.exports) module.exports = core; else root.TrainingCore = core;
})(typeof window !== "undefined" ? window : globalThis);

/* training_shared.js - pieces shared by the training demo pages (training_ui.js: first layout; flow_ui.js: animated layouts):
   DOM helpers, the formulas used by the cards, reference scores (random order and the best classic rule) per mode, and the learning-curve
   drawing. Needs training_core.js, mathml.js and window.RACE_DATA.text (training_wording.md). */
(function () {
  const C = window.TrainingCore;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // formulas for the explanation cards: {{J}} {{reward}} {{score}} {{policy}} {{ret}} {{reinforce}} {{critic}} {{advantage}}
  function formulas(F) {
    const { I, N, O, T, R, sub, sup, frac, sum, M } = MathML;
    const wj = sub(I("w"), I("j")), Tj = sub(I("T"), I("j")), phi = sub(I("φ"), I("j")), th = I("θ");
    const grad = R(I("∇"), I("log"), sub(I("π"), th), O("("), sub(I("a"), I("t")), O("|"), sub(I("s"), I("t")), O(")"));
    return Object.assign(F, {
      J: M(I("J"), O("="), sum(I("j"), R(wj, sup(Tj, N(2))))),
      reward: M(sub(I("r"), I("t")), O("="), O("−"), frac(R(wj, sup(Tj, N(2))), N(10)), T("   (job j started at time t)")),
      score: M(sub(I("z"), I("j")), O("="), sup(th, O("⊤")), phi, O("="), sub(th, T("time left")), O("·"), T("time left"), O("+"), sub(th, T("length")), O("·"), T("length"), O("+"), sub(th, T("importance")), O("·"), T("importance")),

/* flow_centre_ring.js - centre box, version B: "the decision ring". Four stations (State, Action, Reward, Next state) around a ring; a

window.FlowCentre = {

  .st.on { border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
  .st.bad.on { border-color: var(--scratch); box-shadow: 0 0 0 5px color-mix(in srgb, var(--scratch) 22%, transparent); }
  .ringmid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: .8rem; color: var(--muted); text-align: center; font-weight: 600; }
  .rtoken { position: absolute; width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); transform: translate(-50%, -50%); transition: left .55s ease-in-out, top .55s ease-in-out; }
  .trail { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: center; min-height: 1.4rem; }
  .trail i { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--accent); animation: dotpop .35s ease; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: .55rem; font-weight: 700; }
  .trail i.late { background: var(--scratch); }
  .trail i.end { background: var(--ink); width: auto; padding: 0 .5rem; border-radius: 1rem; }
  @keyframes dotpop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  create(root) {

    const UI = window.RACE_DATA.text.ui, fill = (t, v) => t.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
    root.innerHTML = "";

    ring.innerHTML = `<svg viewBox="0 0 300 200" preserveAspectRatio="none"><ellipse class="orbit" cx="150" cy="100" rx="118" ry="70"></ellipse></svg>`;
    // station centres as fractions of the ring box: state (top), action (right), reward (bottom), next state (left)
    const pos = { state: [50, 12], action: [84, 50], reward: [50, 88], next: [16, 50] }, names = { state: "loop.state", action: "loop.action", reward: "loop.reward", next: "loop.next" };
    const st = {};

    const mid = el("div", "ringmid"), tok = el("div", "rtoken"); ring.append(mid, tok); wrap.append(ring, trail); root.append(wrap);

      get out() { return st.state; },
      get in() { return st.action; },
      async state(info) { n = info.k; mid.textContent = fill(UI["ring.decision"], { k: info.k + 1, n: info.n }); on("state"); st.state.querySelector(".v").textContent = fill(UI["chain.node"], { t: info.t, n: info.waiting }); st.action.querySelector(".v").textContent = ""; st.reward.querySelector(".v").textContent = ""; st.next.querySelector(".v").textContent = ""; await wait(500); },

    };

/* flow_ui.js - the animated "Watch the loop" layouts (flow_a.html, flow_b.html). Layout: job queue on the left, two machines on top, the

    const L = learner(), jobs = C.makeInstance(S.rng[S.mode], online());
    S.ep = C.runEpisode(jobs, L.sample); S.k = 0; S.shown = new Set(); S.blocks = []; S.last = null;
    centre.reset(); drawQueue(jobs, [], null, null); drawMachines([], null, null); paintProbs(null); paintCritic(null);
  }
  async function playDecision(id) {
    centre.speed = S.speed;
    const ep = S.ep, k = S.k, st = ep.steps[k], jobs = st.state.jobs, L = learner(), p = L.probs(st.state), t = st.state.t, jobsLeft = ep.steps.length - k - 1;
    const chosen = st.job, pct = Math.round(p[st.k] * 100);
    // 1. state
    setNarr(UI["narr.state"]);
    const future = jobs.map((j, i) => i).filter(i => !st.state.waiting.includes(i) && !ep.steps.slice(0, k).some(s => s.job === i) && jobs[i].a > t).map(i => jobs[i].a);
    const nextArr = online() && future.length ? Math.min(...future) : null;
    drawQueue(jobs, st.state.waiting, null, nextArr);
    drawMachines(S.blocks, t, null);
    await centre.state({ k, n: ep.steps.length, t, m: st.state.machine + 1, waiting: st.state.waiting.length });
    await sleep(250, id); guard(id);
    // 2. state -> network
    setNarr(UI["narr.net"]);
    await fly(centre.out, cfg.net.querySelector("#e1"), id, "tk state", "s", 600);
    paintProbs(null); paintCritic(st, k);
    for (let i = 0; i < 3; i++) { const a = [54, INPUTS[i][1]]; pulse(a[0], a[1], SCORE.x - 16, SCORE.y, id, 450); }
    await sleep(500, id);
    await pulse(SCORE.x + 16, SCORE.y, SOFT.x - 14, SOFT.y, id, 350);
    paintProbs(st, p, st.k);
    await sleep(700, id);
    // 3. action back to the chain, the job flies to the machine
    setNarr(fill(UI["narr.action"], { job: chosen + 1, pct }));
    const bar = cfg.net.querySelector("#pb" + st.k);
    await fly(bar, centre.in, id, "tk action", "J" + (chosen + 1), 650);
    await centre.action({ job: chosen + 1, pct });
    drawQueue(jobs, st.state.waiting, chosen, nextArr);
    const qEl = cfg.queue.querySelector(`[data-job="${chosen}"]`);
    setNarr(fill(UI["narr.place"], { job: chosen + 1, m: st.state.machine + 1 }));
    const newBlock = { job: chosen, machine: st.state.machine, start: st.start, end: st.end, late: st.lateness > 0 };
    S.blocks.push(newBlock);
    const mBox = cfg.machines[st.state.machine];
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize), mb = mBox.getBoundingClientRect();
    await fly(qEl || cfg.queue, { x: mb.left + mb.width / 2, y: mb.top + ((st.start + st.end) / 2) * UNIT * rem }, id, "tk job", "J" + (chosen + 1), 650);
    drawQueue(jobs, st.state.waiting.filter(j => j !== chosen), null, nextArr); drawMachines(S.blocks, t, newBlock);
    await sleep(250, id);
    // 4. reward pops up, joins the chain
    const late = st.lateness > 0, rtxt = late ? st.reward.toFixed(1) : "0";
    setNarr(fill(UI["narr.reward"], { reward: rtxt, outcome: late ? fill(UI["narr.late"], { late: st.lateness }) : UI["narr.ontime"] }));
    const blkEl = mBox.querySelector(".mblk.fresh") || mBox;
    await popup(blkEl, rtxt, late ? "bad" : "good", id, 900);
    await centre.reward({ reward: rtxt, late, lateness: st.lateness, w: jobs[chosen].w });
    // 5. next state
    setNarr(UI["narr.next"]);
    const last = k + 1 >= ep.steps.length;
    await centre.next({ done: last, cost: ep.cost, t: last ? st.end : ep.steps[k + 1].state.t, n: last ? 0 : ep.steps[k + 1].state.waiting.length });
    S.k++;
    if (last) await finishEpisode(id);
  }
  async function finishEpisode(id) {
    const L = learner(), ep = S.ep;
    setNarr(fill(UI["narr.update"], { cost: ep.cost }));
    await fly(centre.in, cfg.net.querySelector("#e1"), id, "tk reward", "Σr", 700);
    L.update(ep); hist()[S.active].push(ep.cost); S.ep = null; S.tested = null;
    paintWeights(); drawCurve(); cfg.net.classList.add("flash"); setTimeout(() => cfg.net.classList.remove("flash"), 600);
    await sleep(500, id);
  }

  // ---- controls ---------------------------------------------------------------------------------------------------------------------
  const budgetLeft = () => learner().episodes < C.TRAIN_EPISODES;
  function setButtons() {
    cfg.b.play.textContent = S.playing ? UI["btn.pause"] : UI["btn.play"];
    cfg.b.step.disabled = S.playing || S.busy; cfg.b.train.disabled = S.playing || S.busy; cfg.b.test.disabled = S.playing || S.busy;
    cfg.modeBox.querySelectorAll("button").forEach(b => { b.setAttribute("aria-checked", String(b.dataset.mode === S.mode)); b.disabled = S.playing || S.busy; });
    cfg.learnerBox.querySelectorAll("button").forEach(b => { b.setAttribute("aria-checked", String(b.dataset.kind === S.active)); b.disabled = S.playing || S.busy; });
    cfg.speedBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(+b.dataset.speed === S.speed)));
    cfg.netTitle.textContent = S.active === "ac" ? UI["panel.network.ac"] : UI["panel.network.reinforce"];
  }
  async function run(one) {
    const id = ++S.runId; S.busy = true; setButtons();
    try {
      do {
        if (!S.ep) { if (!budgetLeft()) { setMsg(fill(TP["msg.budget"], { n: C.TRAIN_EPISODES })); break; } startEpisode(); }
        await playDecision(id);
      } while (!one && S.playing && budgetLeft());
    } catch (e) { if (e !== ABORT) throw e; }
    if (S.runId === id) { S.busy = false; S.playing = false; setButtons(); }
  }
  function doPlay() { if (S.playing) { S.playing = false; setButtons(); return; } S.playing = true; setButtons(); run(false); }
  function doStep() { if (!S.busy) run(true); }
  function doTrain() {  // no film: the learner trains fast, the curve and weights update, the chain shows the latest episode
    if (S.busy) return; const L = learner(); if (!budgetLeft()) { setMsg(fill(TP["msg.budget"], { n: C.TRAIN_EPISODES })); return; }
    const id = ++S.runId; S.busy = true; S.ep = null; setButtons(); let last = performance.now(), owed = 0;
    const tick = now => {
      if (S.runId !== id) return;
      owed += Math.min(now - last, 100) / 1000 * 30 * S.speed; last = now;
      let ep = null; while (owed >= 1 && budgetLeft()) { owed -= 1; ep = L.train(C.makeInstance(S.rng[S.mode], online())); hist()[S.active].push(ep.cost); }
      if (ep) { centre.snap(ep); drawQueue(ep.steps[0].state.jobs, [], null, null); drawMachines(ep.blocks, null, null); }
      paintWeights(); drawCurve(); setNarr("");
      if (!budgetLeft()) { S.busy = false; setButtons(); setMsg(fill(TP["msg.trained"], { n: L.episodes })); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function doTest() {
    const R = refs(); setMsg(fill(TP["msg.testing"], { n: R.sets.length }));
    setTimeout(() => { const v = C.meanCost(R.sets, learner().greedy); setMsg(fill(UI["test.line"], { n: R.sets.length, random: R.random.toFixed(0), rule: R.rule.name, rulecost: R.rule.cost.toFixed(0), learner: v.toFixed(0) })); }, 30);
  }
  function resetAll() { newState(); redraw(); setMsg(""); setNarr(UI["narr.idle"]); setButtons(); }
  function redraw() {
    centre.reset(); drawQueue([], [], null, null); drawMachines([], null, null); buildNet(); paintProbs(null); paintCritic(null); drawCurve(); setButtons();
  }

  // ---- start-up ---------------------------------------------------------------------------------------------------------------------
  function init(c, centreModule) {
    cfg = c; S = {};
    const st = document.createElement("style"); st.textContent = centreModule.css; document.head.append(st);
    document.querySelectorAll("[data-ui]").forEach(e => { e.textContent = UI[e.dataset.ui]; });
    K.init(c.explain, () => ({}), id => K.topicCard(id, {}));
    centre = centreModule.create(c.centre);
    const mk = (label, fn, cls) => { const b = el("button", cls || "go", label); b.type = "button"; b.onclick = fn; return b; };
    cfg.b = { play: mk(UI["btn.play"], doPlay), step: mk(UI["btn.step"], doStep, "ghost"), train: mk(UI["btn.train"], doTrain, "ghost"), test: mk(UI["btn.test"], doTest, "ghost") };
    c.controls.append(cfg.b.play, cfg.b.step, cfg.b.train, cfg.b.test, mk(UI["btn.reset"], resetAll, "ghost"));
    cfg.speedBox = el("div", "seg small");
    [1, 3, 10].forEach(s => { const b = el("button", null, UI["speed." + s]); b.type = "button"; b.dataset.speed = s; b.onclick = () => { S.speed = s; setButtons(); }; cfg.speedBox.append(b); });
    c.controls.append(cfg.speedBox);
    cfg.learnerBox = el("div", "seg small");
    [["reinforce", "learner.reinforce"], ["ac", "learner.ac"]].forEach(([kind, key]) => {
      const b = el("button", null, UI[key]); b.type = "button"; b.dataset.kind = kind;
      b.onclick = () => { S.active = kind; S.ep = null; redraw(); setNarr(UI["narr.idle"]); setMsg(""); };
      cfg.learnerBox.append(b);
    });
    c.controls.append(cfg.learnerBox);
    cfg.modeBox = el("div", "seg small");
    ["offline", "online"].forEach(m => {
      const b = el("button", null, UI["mode." + m]); b.type = "button"; b.dataset.mode = m;
      b.onclick = () => { S.mode = m; S.ep = null; redraw(); setNarr(UI["narr.idle"]); setMsg(""); };
      cfg.modeBox.append(b);
    });
    c.modeSlot.append(cfg.modeBox);
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-explain]");
      if (t && !t.closest("#explain")) K.open(t.dataset.explain === "learner" ? (S.active === "reinforce" ? "reinforce" : "actor_critic") : t.dataset.explain, {});
    });
    window.addEventListener("resize", drawCurve);
    S = { mode: "offline", active: "reinforce", speed: 1 };
    resetAll();
  }
  window.FlowUI = { init };
})();

document.querySelectorAll("[data-machine]").forEach(e => { e.textContent = RACE_DATA.text.ui["machine.name"].replace("{m}", e.dataset.machine); });
FlowUI.init({
  explain: document.getElementById("explain"), fx: document.getElementById("fx"), queue: document.getElementById("queue"), machines: [document.getElementById("m0"), document.getElementById("m1")],
  centre: document.getElementById("centreinner"), narr: document.getElementById("narr"), msg: document.getElementById("msg"), controls: document.getElementById("controls"),
  modeSlot: document.getElementById("modeslot"), net: document.getElementById("netsvg"), netTitle: document.getElementById("nettitle"), curve: document.getElementById("curve"),
  episodes: document.getElementById("episodes")
}, FlowCentre);
</script>
