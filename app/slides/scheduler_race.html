<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduler Race Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* base.css - tokens and shared components for the browser demo variants (inlined at build time). */
:root {
  --bg: #ffffff; --surface: #ffffff; --ink: #0e2238; --muted: #56677a; --rule: #cbd9ee;
  --accent: #2a6fd1; --accent-ink: #ffffff; --rulebar: #8793a1; --copied: #2a6fd1; --scratch: #e0702a; --win: #14866d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
/* White background only, for now (a deliberate single look): the page stays white even when the device or viewer is in dark mode.
   The dark palette is kept here for later: re-add it under @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... } }
   and :root[data-theme="dark"] { ... } with: --bg #0c1623; --surface #14243a; --ink #eaf0f7; --muted #9db0c4; --rule #28405c;
   --accent #5b9bf0; --accent-ink #08121f; --rulebar #7f8c9b; --copied #5b9bf0; --scratch #f28a4a; --win #3cc5a4; color-scheme: dark. */
:root { color-scheme: light; }
html { font-size: clamp(15px, 2.5vh, 32px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.25; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2 { font-family: var(--display); margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 7.2rem 1fr; gap: .6rem; align-items: center; }
.row > .q { font-weight: 600; font-size: .95rem; }
.row .hint { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .3rem; min-width: 0; }
.seg button { flex: 1 1 auto; white-space: nowrap; padding: .42rem .55rem; border: 2px solid var(--rule); background: var(--surface); border-radius: .5rem; font-weight: 600; font-size: .95rem; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .38; cursor: not-allowed; }
.seg button:focus-visible, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--scratch); outline-offset: 2px; }
.chip { border: 2px solid var(--rule); background: var(--surface); border-radius: 999px; padding: .38rem .8rem; font-weight: 600; font-size: .92rem; }
.chip:hover { border-color: var(--accent); }
.go { background: var(--ink); color: var(--bg); border: 0; border-radius: .7rem; padding: .7rem 1.4rem; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.go:hover { filter: brightness(1.15); }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: .2rem; margin-right: .35rem; vertical-align: -.1rem; }
.k-rule { --c: var(--rulebar); } .k-copied { --c: var(--copied); } .k-scratch { --c: var(--scratch); }
.lane .t { font-weight: 700; font-size: 1.05rem; } .lane .d { color: var(--muted); font-size: .78rem; }
.lane .pct { font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.lane.win .t::after { content: "  winner"; color: var(--win); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.verdict { font-size: .95rem; }
.verdict b { font-family: var(--display); font-size: 1.15rem; }
.note { color: var(--muted); font-size: .8rem; margin-top: .25rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Variant A: controls on the left, the race on the right, everything on one screen. */
.app { height: 100%; box-sizing: border-box; padding-block: .8rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-rows: auto 1fr; gap: .7rem; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.top h1 { font-size: 1.9rem; }
.cols { display: grid; grid-template-columns: 5fr 6fr; gap: 1rem; min-height: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: .9rem; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .55rem; min-height: 0; min-width: 0; }
.left { display: flex; flex-direction: column; gap: .8rem; min-height: 0; }
.left .panel:last-child { flex: 1; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.panel .row { grid-template-columns: 11.6rem 1fr; }
.right { justify-content: space-between; }
.race-head { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; }
#lanes { position: relative; flex: 1; min-height: 13rem; --n: 5; }
#verdict { flex: none; min-height: 6rem; }  /* space is reserved so the lanes keep their height when the winner text appears */
.lane { position: absolute; left: 0; right: 0; top: 0; height: calc(100% / var(--n)); display: flex; flex-direction: column; justify-content: center; transition: transform .55s cubic-bezier(.3, .7, .3, 1); box-sizing: border-box; padding-block: .15rem; }
.idle { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 1.1rem; padding: 0 1rem; }
.lane.win .track { outline: 3px solid var(--win); outline-offset: 2px; }
.lane .top2 { display: flex; justify-content: space-between; align-items: flex-end; gap: .6rem; }
.track { height: 1.35rem; background: color-mix(in srgb, var(--ink) 9%, transparent); border-radius: .5rem; overflow: hidden; margin-top: .25rem; }
.fill { height: 100%; background: var(--c); border-radius: .5rem; }
.explainable { cursor: pointer; } .explainable:hover { color: var(--accent); }
.info { color: var(--accent); font-weight: 700; } .tip { font-style: italic; }
.lane { cursor: pointer; } .lane:hover .t { color: var(--accent); } #verdict { cursor: pointer; }
/* slide-over explanation card: overlays the page, so the one-screen layout is untouched */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(38rem, 96vw); background: var(--surface); color: var(--ink); border-left: 1px solid var(--rule); box-shadow: -.6rem 0 2rem rgba(0, 0, 0, .18); transform: translateX(105%); transition: transform .3s ease; z-index: 20; display: flex; flex-direction: column; font-size: .92rem; }
.drawer.open { transform: none; }
.drawer .dhead { display: flex; justify-content: space-between; padding: .6rem .8rem 0; }
.drawer .dhead button { border: 0; background: transparent; font-size: 1rem; padding: .3rem .5rem; border-radius: .4rem; }
.drawer .dhead button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.dbody { overflow: auto; padding: .3rem 1.2rem 1.5rem; flex: 1; }
.dbody h2 { font-size: 1.35rem; margin: .1rem 0 .6rem; }
.dbody p { margin: .4rem 0; line-height: 1.45; }
.sec { border-top: 1px solid var(--rule); padding: .4rem 0; }
.sec summary { cursor: pointer; font-weight: 700; font-family: var(--display); padding: .25rem 0; }
.sbody { padding-bottom: .3rem; }
.dbody math { font-size: 1.12rem; } .dbody math[display="block"] { margin: .5rem 0; overflow-x: auto; max-width: 100%; }
.dbody code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 0 .25rem; border-radius: .25rem; font-size: .85em; }
.mini { border-collapse: collapse; width: 100%; font-size: .82rem; margin: .4rem 0; font-variant-numeric: tabular-nums; }
.mini th, .mini td { border-bottom: 1px solid var(--rule); padding: .25rem .35rem; text-align: right; } .mini th:first-child, .mini td:first-child { text-align: left; }
.mini tr.on td { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
.related { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .9rem; padding-top: .7rem; border-top: 1px solid var(--rule); }
/* narrower windows: give the option buttons more room so labels such as "Overloaded" stay on one line */
@media (max-width: 1250px) { .panel .row { grid-template-columns: 8.2rem 1fr; gap: .4rem; } .seg button { padding: .35rem .3rem; font-size: .82rem; } .row > .q { font-size: .85rem; } .row .hint { font-size: .68rem; } }
@media (max-width: 800px) { html, body { height: auto; } .app { height: auto; } .cols { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; gap: .25rem; } }
</style>
<div class="app">
  <div class="top"><h1 data-ui="heading"></h1>
    <div class="legend"><span class="explainable" data-explain="kind_rule"><i style="background:var(--rulebar)"></i><span data-ui="legend.rule"></span></span><span class="explainable" data-explain="kind_copied"><i style="background:var(--copied)"></i><span data-ui="legend.copied"></span></span><span class="explainable" data-explain="kind_own"><i style="background:var(--scratch)"></i><span data-ui="legend.own"></span></span></div></div>
  <div class="cols">
    <div class="left">
      <section class="panel"><div class="eyebrow explainable" data-explain="setup" data-ui="step1"></div><div id="situation" style="display:flex;flex-direction:column;gap:.5rem"></div></section>
      <section class="panel"><div class="eyebrow explainable" data-explain="objective" data-ui="step2"></div><div id="examples" class="chips"></div><div id="factors" style="display:flex;flex-direction:column;gap:.45rem"></div></section>
    </div>
    <section class="panel right">

      <div id="lanes"></div>
      <div id="verdict" class="verdict" aria-live="polite"></div>
    </section>
  </div>
</div>
<aside id="explain" class="drawer" aria-hidden="true" aria-label="Explanation"></aside>

cite":"Added in this project (2026-10-21) so ties are decided by a job feature a network can read."},"WLST":{"name":"Weighted least slack","plain":"Weighted least slack: slack divided by weight while a job can still be on time, multiplied by weight once it is late.","cite":"Constructed for this project (not a published rule)."},"LST":{"name":"Least slack first","plain":"Starts the job with the least slack: time left before it must start to finish on time.","cite":"Classical (least slack time)."},"WSPT":{"name":"Weighted shortest job first","plain":"Weighted shortest job first: important and short jobs first.","cite":"Smith (1956), Naval Research Logistics Quarterly 3."},"SPT":{"name":"Shortest job first","plain":"Starts the shortest job first.","cite":"Classical (shortest processing time)."},"LPT":{"name":"Longest job first","plain":"Starts the longest job first.","cite":"Graham (1969), Bounds on multiprocessing timing anomalies."},"WMDD":{"name":"Weighted modified due date","plain":"Weighted modified due date: time to the deadline (but at least the job's own length), divided by its weight.","cite":"Kanet & Li (2004), Journal of Scheduling 7(4); designed for linear tardiness, applied unchanged to the squared cost."},"WEDF":{"name":"Weighted earliest deadline first","plain":"Weighted earliest deadline first: time to the deadline, weight-scaled the same way as WLST.","cite":"Constructed for this project (not a published rule)."},"MDC":{"name":"Marginal delay cost (MDC)","plain":"Marginal delay cost: starts the job whose one-tick delay adds the most squared lateness per unit of its own length.","cite":"Derived in this project from the cost J (2026-10-07), using Smith's ratio logic (1956). A heuristic for parallel machines, not a guarantee."},"COVERT":{"name":"COVERT (urgency versus cost)","plain":"COVERT (cost over time): the weighted-shortest-job index, scaled by how close the job is to being late.","cite":"Carroll (1965), MIT PhD thesis; compared with ATC in Vepsalainen & Morton (1987). Simplified lead-time estimate (flagged in the code)."},"ATC":{"name":"Apparent tardiness cost (ATC)","plain":"Apparent Tardiness Cost: the weighted-shortest-job index, switched on as a job runs out of slack.","cite":"Vepsalainen & Morton (1987), Management Science 33(8). k = 2 is the literature default, not re-tuned here."},"FCFS":{"name":"First come, first served","plain":"First come, first served.","cite":"Classical."},"RandomRule":{"name":"Random order","plain":"Picks a waiting job at random (a sanity-check baseline).","cite":"Baseline."}},"placements":{"FirstFit":{"short":"first machine that fits","plain":"First fit: the first machine (lowest index) where the job fits.","cite":"Johnson (1973), Near-optimal bin packing algorithms."},"BestFit":{"short":"tightest-fitting machine","plain":"Best fit: the machine that is left with the least spare capacity.","cite":"Johnson (1973)."},"Consolidate":{"short":"packs jobs onto few machines","plain":"Consolidate: the machine whose use switches on the fewest new machine-ticks over the job's run (ties by best fit), so work is packed onto few machines and the rest stay off.","cite":"Per-job version of the 'allocate where power increases least' idea of Beloglazov, Abawajy & Buyya (2012), Future Generation Computer Systems."}},"options":{"0":{"short":"picks job and machine directly","name":"Option 0, full action space","plain":"The network picks a (job, machine) pair, or idle, directly: max_jobs \u00d7 M + 1 choices."},"1":{"short":"picks which rule to apply","name":"Option 1, rule selection","plain":"Instead of directly placing jobs, it selects a rule to do so"},"2":{"short":"scores each waiting job","name":"Option 2, priority learning","plain":"The network gives every waiting job a score (within a window) and the best-scoring job is started. A fixed placement rule then picks its machine."},"3":{"short":"scores each waiting job","name":"Option 3, priority learning with an ATC hint","plain":"As Option 2, along with the ATC urgency index."},"4":{"short":"picks a job-machine pair","name":"Option 4, job \u00d7 machine branching","plain":"The network picks a job and then a machine in two steps."}},"templates":{"ai.title":"AI scheduler","detail.rule":"classic rule; {placement}","detail.rule.noplacement":"classic rule","detail.ai":"{what} | {algo}{budget}","detail.copies":"copies {rule}","detail.copies.generic":"copies a classic rule","detail.atc_hint":"{what} using an urgency hint","budget.1M":"(1M steps)","budget.2M":"(2M steps)","racer.title.rule":"{rule} + {placement}","racer.title.ai":"{title}: {detail}","racer.kicker.rule":"Classic rule","racer.kicker.ai":"AI scheduler","racer.results":"Mean over {inst} test instances ({runs}). Highlighted rows are the things you weighted.","racer.runs.many":"average of {n} independent training runs; \u00b1 is the standard deviation across runs","racer.runs.one":"\u00b1 is the standard deviation across the test instances","racer.table.measured":"Measured","racer.table.value":"Value","racer.table.bestrule":"Best rule","racer.table.ratio":"Ratio","racer.table.weight":"\u03bb","racer.table.contrib":"\u03bb \u00d7 ratio","racer.sum":"Score *S* = {terms} = **{score}**. Best score in this scenario *S*^{*} = {best}, so the gap is {gap}% and the bar shows 100 \u00d7 exp(\u22124 \u00d7 {gapfrac}) = **{pct}%**.","racer.rule.what":"**{name}**: {plain}\n\nMachine choice: {placement}","racer.rule.math":"A job is chosen from those that can start now by this key; *t* is the current time.","racer.rule.deeper":"Source: {cite}\n\nPlacement: {pcite}\n\nA rule is deterministic, so its numbers have no training-run spread. Its table values are means over the test instances.","racer.ai.what":"**{optname}.** {optplain}","racer.ai.window":"It looks at the {win} most urgent (earliest-deadline) jobs that can start now, plus a count of the backlog beyond them, and a fixed placement rule ({plc}) picks the machine.","racer.ai.allslots":"It looks at every job slot, and a fixed placement rule ({plc}) picks the machine.","racer.ai.copied":"Trained by copying **{rule}** (behaviour cloning).","racer.ai.copied.generic":"Trained by copying **a classic rule** (behaviour cloning).","racer.ai.scratch":"Trained with {algo} from scratch (no rule copied).","racer.ai.budget":"Budget: {steps} environment steps.","racer.ai.obj.j":"Training objective: the squared-lateness cost J only.","racer.ai.obj.multi":"Training objective: the squared-lateness cost J plus {terms}, at fixed reference weights.","racer.ai.obj.copy":"Its objective only trains its value estimate and any fine-tuning; the choices themselves are copied from the rule.","racer.ai.math.other":"See Code/methods/rl/action_spaces in the project for this option's action space.","racer.ai.deeper.copy":"Copying: expert labels come from the copied rule on the states the network itself visits (DAgger; Ross, Gordon & Bagnell 2011), then the value head is warmed up with the policy frozen.","racer.ai.deeper.scratch":"Training objective: the shaped reward below, which keeps the optimal policy of the objective the model was trained on (Ng, Harada & Russell 1999).","racer.ai.deeper.tail":"Here *c* is the number of jobs in the instance, \u03b3 the discount, and \u03a6 the lateness potential. {algonote} Each AI result is the mean over its training runs; one training run per seed is evaluated once on every test instance.","racer.ai.deeper.scorer":"Options 2 and 3 score each job from its own features only (shared weights), so the network cannot compare two jobs directly; the surrounding context only affects the idle option and the critic.","racer.ai.algonote.A2C":"A2C (Mnih et al. 2016) replaces PPO's clipped objective with a plain advantage actor-critic update.","racer.ai.algonote.PPO":"PPO: Schulman et al. 2017.","factor.insore":"This row sets \u03bb for the metric `{metric}`: Ignore 0, Some 2, A lot 5. Its contribution to a method's score is \u03bb \u00d7 (method's value \u00f7 best rule's value).","factor.section.plain":"In plain words","factor.section.formulation":"Formulation","factor.section.insore":"In the score","math.smallest":"(smallest first)","math.largest":"(largest first)","math.largest_k":"(largest first, k = 2)","math.mdc_tie":"(largest first; jobs with \u0394C = 0 go by least slack)","math.wlst_if":"if \u03c3 \u2265 0,","math.wlst_else":"otherwise","math.wlst_with":"with \u03c3 =","math.wedf_scaled":"weight-scaled","math.slack_range":"slack range","math.energy_cond":"machine m runs at least one job at tick t","math.unfinished":"unfinished","math.visited":"states visited","math.policy.shared":"(shared weights, embedding size 128)","math.policy.over":"over the jobs that can start now, plus an idle option","math.policy.note":"The idle option's score comes from the mean job embedding, the mean machine embedding and the time. Jobs that cannot start are masked out.","math.opt1.machine":"machine chosen by \u03c0","math.opt1.note":"The network scores each (rule, placement) pair and picks one with a softmax; the chosen rule then selects the job.","math.opt0.z":"z is the score of job j on machine m, computed from their embeddings","math.opt0.note":"A pointer-style network scores every job-machine pair. The action space has max_jobs \u00d7 M + 1 choices, which is why learning from scratch is hard here.","math.reward.note":"\u0108_{j} is the earliest time job j can still finish (fixed once it starts). \u03a6 is potential-based, so it adds no new optimum."},"topics":{"setup":{"kicker":"The situation","title":"The scheduling problem and the experimental setup","related":["arrival","machines","deadlines","objective"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Users send jobs to a server that require machines to process their request. Each job have values like deadline, resource demand (CPU, memory, ...), and processing duration. A scheduler must decide which waiting job to start on which machine whilst fitting a set of constraints e.g a machine at 100% capacity can't take in another job."},{"h":"Formulation","open":true,"text":"Job *j* has arrival a_{j}, processing duration p_{j}, deadline d_{j}, weight w_{j} and resource demand u_{jr}. There are *M* = 10 machines with capacity C_{r} per resource *r*. A job started at time s_{j} on machine *m* occupies u_{jr} of resource *r* on machine *m* for ticks [s_{j}, s_{j} + p_{j} \u2212 1] and may never exceed C_{r}. It completes at C_{j} = s_{j} + p_{j}, and is late by\n\n{{tard}}\n\nThe objective is a weighted sum of up to four terms (linear lateness, squared lateness, late jobs, energy), each with a switch \u03bb:\n\n{{objfull}}\n\nEach model is trained on a choice of which terms to switch on (its card says which). Switching on only the squared-lateness term (\u03bb_{S} = 1, the others 0) gives the cost\n\n{{J}}\n\nModels labelled '+tardiness obj', '+late-job obj' or '+energy obj' have the extra terms switched on as well. Jobs are never dropped here, so the dropped-job term of the full objective is always zero.\n\nIdling is always allowed (it can pay to leave a machine empty)."},{"h":"Experimental setup","open":false,"text":"Each scenario has 50 held-out test instances (generated job sets, random seeds 500000 and up). Every method is run once on every instance and the metrics are averaged over the 50. Learned models are trained separately (3 to 10 training runs per kind) and their average is shown. A second set of 50 fresh instances (seeds 700000 and up) is used only for the confirmation results.\n\nGiven **all jobs are known** in advance, we give the environment 100 time units with 100 jobs whose values are drawn uniformly to find its best schedule. In the case of **online job arrivals**, the same setup is used with the addition of Poisson arrivals over the same 100 time units at differing job arrival loads \u03c1."}]},"arrival":{"kicker":"The situation","title":"Are jobs are provided","related":["setup","machines","deadlines"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"**Over time (online):** a job is only revealed when it arrives, so the scheduler cannot plan for jobs it has not seen. **Known in advance (offline):** every job is known at time 0 and the scheduler can see them all."},{"h":"Formulation","open":false,"text":"Online, arrival times a_{j} come from a Poisson process with rate \u03bb and a decision at time *t* may use only jobs with a_{j} \u2264 *t*. Offline, a_{j} = 0 for all jobs. Offline instances have 100 jobs; online instances run over a horizon of 100 ticks with a preferred horizon *H*, and jobs may finish after it (the cost still counts their lateness)."}]},"machines":{"kicker":"The situation","title":"How busy the machines are (load factor \u03c1)","related":["setup","arrival","deadlines"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Quiet: the machines are about half used on average. Normal: about three quarters. Busy: nearly full. Overloaded: more work arrives than the machines can ever finish, so a queue builds up."},{"h":"Formulation","open":true,"text":"\u03c1 (rho) says how busy the machines are. \u03bb (lambda) is how many jobs arrive per tick (the rate of the Poisson arrivals). They are linked: the more jobs arrive per tick, the busier the machines. Standard queueing utilisation (Kleinrock 1975), for resource *r*, with *M* machines of capacity C_{r}, where *E*[p u_{r}] is the average work one job brings on that resource:\n\n{{rho}}\n\nWe choose the busyness we want to test, \u03c1 = 0.50, 0.75, 0.95 or 1.10, and then set \u03bb to the arrival rate that gives exactly that \u03c1. Because \u03c1 grows in proportion to \u03bb, this is a single scaling: \u03bb = \u03c1 \u00f7 (the \u03c1 you would get at one job per tick), where that reference value is measured on a large sample from the project's own job generator (lognormal job sizes). \u03c1 < 1: the machines can keep up on average. \u03c1 \u2265 1: more work arrives than they can finish, so a queue builds up."}]},"deadlines":{"kicker":"The situation","title":"How tight the deadlines are","related":["setup","importance_jobs","machines"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Tight deadlines leave jobs little spare time, so more of them end up late and the choice of schedule matters more."},{"h":"Formulation","open":true,"text":"**Offline** (tardiness factor TF and due-date range RDD, Potts & Van Wassenhove 1985), with *L* a lower bound on the makespan:\n\n{{dueOff}}\n\nRelaxed, Medium, Tight use TF = 0.2, 0.5, 0.8 with RDD = 0.6; deadlines are never earlier than a job's own length.\n\n**Online**:\n\n{{dueOn}}\n\nTight deadlines use a slack range of 5 to 25 ticks and exist only at Normal load."}]},"importance_jobs":{"kicker":"The situation","title":"Are all jobs equally important?","related":["objective","setup"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"If all jobs are equal, lateness of any job costs the same. If some matter more, being late on an important job costs more."},{"h":"Formulation","open":true,"text":"The weight w_{j} multiplies every lateness term of the objective (linear lateness, squared lateness and late jobs). Energy has no weights. The full objective is\n\n{{objfull}}\n\nWith only the squared-lateness term switched on, the objective is the cost J:\n\n{{J}}\n\nThe 'All equal' option sets w_{j} = 1 for every job; 'Some matter more' draws integer weights from 1 to 5. Tested offline only."}]},"objective":{"kicker":"What matters to you","title":"The objective and your choices","related":["f_delay","f_late","f_wait","f_flow","f_energy","bar"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Every option provided to rate is a measured quantity of a finished schedule. The ratings decide the weights of how much each metric mattters and how the models will be scored against. Lower overall score is better."},{"h":"Formulation","open":true,"text":"With metric values x_{m} of a method, the best rule's value x_{m,ref} on that metric, and your weights \u03bb_{m} (Ignore = 0, Some = 2, A lot = 5):\n\n{{score}}\n\nThe race will then compares *S* with the best score *S*^{*} found among all rules and learned models to make a relative score:\n\n{{pct}}\n\nWith the current selected weights:\n\n{{weights_table}}"},{"h":"How it relates to what the AI was trained for","open":true,"text":"The learned schedulers are trained by reinforcement learning to minimise an objective built from the same kinds of terms as your choices:\n\n{{objfull}}\n\nEach learned model is trained on a choice of these terms, and its card says which. With only the squared-lateness term switched on, the objective is the cost\n\n{{J}}\n\nModels labelled '+tardiness obj', '+late-job obj' and '+energy obj' in the results have the extra terms (linear lateness, late jobs, energy) switched on as well, at fixed reference weights. Models that copy a rule are trained by imitation, so the objective only trains their value estimate and any fine-tuning.\n\nYour own weights decide how every finished schedule is scored here. There are endless combinations of weights, so a model cannot be trained for each one in advance; a model can therefore do better on some of your priorities than on others."}]},"f_delay":{"kicker":"What matters to you","title":"Avoid long delays","related":["objective","bar"],"metric":"objective_J","sections":[{"h":"In plain words","open":true,"text":"Counts how late jobs are, with big delays hurting much more than small ones (squared) and important jobs counting more."},{"h":"Formulation","open":true,"text":"{{tard}}\n\n{{J}}\n\nThis is the cost that most of the learned models were trained to minimise. Models labelled '+tardiness obj', '+late-job obj' or '+energy obj' were trained on this cost plus the extra terms."}]},"f_late":{"kicker":"What matters to you","title":"Avoid late jobs","related":["objective","bar"],"metric":"late_jobs","sections":[{"h":"In plain words","open":true,"text":"How many jobs finish after their deadline, however late."},{"h":"Formulation","open":true,"text":"{{late}}\n\nA job counts as late if T_{j} > 0. Late jobs are never refused: they are counted. This row counts every late job once; the late-job term used when training some models is weighted, each late job counting w_{j} times."}]},"f_wait":{"kicker":"What matters to you","title":"Short waiting before a job starts","related":["objective","bar"],"metric":"mean_wait","sections":[{"h":"In plain words","open":true,"text":"How long a job sits in the queue before it starts, on average."},{"h":"Formulation","open":true,"text":"{{wait}}\n\ns_{j} is the start time and a_{j} the arrival. This is a score, not a limit: no rule guarantees a maximum wait."}]},"f_flow":{"kicker":"What matters to you","title":"Finish each job quickly after it arrives","related":["objective","bar"],"metric":"mean_flow_time","sections":[{"h":"In plain words","open":true,"text":"How long a job takes from arrival to finish, on average (waiting plus running)."},{"h":"Formulation","open":true,"text":"{{flow}}\n\nC_{j} is the completion time."}]},"f_energy":{"kicker":"What matters to you","title":"Save energy","related":["objective","bar"],"metric":"active_machine_ticks","sections":[{"h":"In plain words","open":true,"text":"How many machines are switched on, and for how long. Packing jobs onto fewer machines saves energy."},{"h":"Formulation","open":true,"text":"{{energy}}\n\nCounted in active machine-ticks (a machine that runs at least one job at a tick counts as one). A linear power model is assumed; a measured SPECpower profile exists in the archive but is not used in this tool."}]},"bar":{"kicker":"The race","title":"How the bar is computed","related":["objective","winner"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"Each bar shows how close a method gets to the best result found for your situation and your priorities. 100% is the best of all rules and learned models in this scenario (not only the five racers). The scale is stretched so that small differences are visible: 5% worse than the best shows as about 82%, 25% worse as about 37%."},{"h":"Formulation","open":true,"text":"{{pct}}\n\nwhere *S* is the method's score (see the objective) and *S*^{*} the lowest score in the scenario. If the best score is not positive the gap is divided by (worst \u2212 best) instead."},{"h":"Deeper","open":false,"text":"The exponential scale is a display choice, not a statistical statement. A bar at 0% only means the score is more than about 2.2 times the best."}]},"winner":{"kicker":"The race","title":"Understanding the results","related":["bar","setup"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"The winner is the racer with the lowest score. When a learned model is within about 5% of the best rule, the project treats the two as equivalent: differences that small were not statistically significant in the earlier tests."},{"h":"Deeper","open":false,"text":"These results are exploratory. 'Beats' was defined in advance as a paired interval over instances lying entirely below zero with at least 5 training runs; none of the learned models met it on the fresh instances. Training-run variance is not included in any interval. See the slides for the fresh-instance results."}]},"kind_rule":{"kicker":"Racers","title":"Classic rules (grey)","related":["kind_copied","kind_own"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"A classic rule ranks the waiting jobs by a simple formula and starts the best-ranked one; a placement rule then picks the machine. They need no training and are fast. Click a rule's bar to see its formula."}]},"kind_copied":{"kicker":"Racers","title":"AI scheduler that copies a rule (blue)","related":["kind_own","kind_rule"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"A neural network was shown what a classic rule chooses in thousands of situations and trained to make the same choice. It is a learning check: can the network represent the rule? It is not expected to beat the rule it copies."},{"h":"Formulation","open":true,"text":"{{copy}}"}]},"kind_own":{"kicker":"Racers","title":"AI scheduler with its own model (orange)","related":["kind_copied","kind_rule"],"metric":"","sections":[{"h":"In plain words","open":true,"text":"A neural network trained by reinforcement learning alone, from random weights, with no rule to copy. It improves its choices from the reward it receives, which is built from its training objective. Results varied widely between training runs."},{"h":"Formulation","open":true,"text":"{{ppo}}\n\n{{reward}}"}]},"racer":{"kicker":"","title":"","related":["objective","bar"],"metric":"","sections":[{"h":"Exact performance","open":true,"text":"{{racer_table}}\n\n{{racer_sum}}"},{"h":"What this is","open":true,"text":"{{racer_what}}"},{"h":"The equations","open":true,"text":"{{racer_math}}"},{"h":"Deeper","open":false,"text":"{{racer_deeper}}"}]}}}};
/* race_core.js - the demo's scoring and race selection in the browser (mirror of app/scoring.py: FACTORS, EXAMPLES,
   race_entries). Needs window.RACE_DATA (written by tools/analysis/make_demo_artifacts.py from the results archive). */
(function () {
  const D = window.RACE_DATA;
  const STEEPNESS = 4.0, NOISE = 0.05;
  const BUSY = { Quiet: "on_rho050", Normal: "on_rho075", Busy: "on_rho095", Overloaded: "on_rho110" };
  const DEADLINES = { Relaxed: "tf02", Medium: "tf05", Tight: "tf08" };
  const LEVELS = { Ignore: 0, Some: 2, "A lot": 5 };

  function presetFor(s) {
    if (s.arrival === "offline") return "off_" + DEADLINES[s.deadlines] + (s.equal ? "_w1" : "");
    return s.tight && BUSY[s.busy] === "on_rho075" ? "on_rho075_tight" : BUSY[s.busy];
  }

  function weights(importance) {  // {factor key: level 0-5} -> weight per metric column
    const w = D.metrics.map(() => 0);
    D.factors.forEach(f => Object.entries(f.metrics).forEach(([m, x]) => { w[D.metrics.indexOf(m)] += (importance[f.key] || 0) * x; }));
    return w;
  }

  function reference(rows, j) {  // best rule on metric j; mean over rules when that is 0 (as scoring.reference_values)
    const v = rows.filter(r => r.family === "H" && r.v[j] != null).map(r => r.v[j]);
    if (!v.length) return null;
    const best = Math.min(...v);
    return best || (v.reduce((a, b) => a + Math.abs(b), 0) / v.length) || 1;
  }

  function run(preset, importance) {
    const rows = (D.presets[preset] || []).map(r => ({ family: r[0], title: r[1], detail: r[2], kind: r[3], model: r[4], v: r[5], meta: r[6] || {} }));
    const w = weights(importance);
    const refs = D.metrics.map((_, j) => reference(rows, j));
    const scored = rows.map(r => {
      let s = 0, ok = true;
      w.forEach((x, j) => { if (!x) return; if (r.v[j] == null || !refs[j]) ok = false; else s += x * r.v[j] / refs[j]; });
      return ok ? Object.assign({}, r, { score: s }) : null;
    }).filter(Boolean).sort((a, b) => a.score - b.score);

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
  const levelKey = v => (v === 0 ? 0 : v <= 2 ? 2 : 5);
  // second line of a racer: "[what it does] | [model]" (first and last part of the exported detail; capitalised)
  const shortDetail = d => { const p = d.split(" | "); const s = p.length > 2 ? p[0] + " | " + p[p.length - 1] : d; return s.charAt(0).toUpperCase() + s.slice(1); };

  // options: [[code key, label shown], ...]; value: the selected code key
  function seg(options, value, onPick, disabled) {
    const box = el("div", "seg"); box.setAttribute("role", "radiogroup");
    options.forEach(([k, label]) => {
      const b = el("button", null, label); b.type = "button"; b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(k === value)); if (disabled && disabled.includes(k)) b.disabled = true;
      b.onclick = () => onPick(k); box.appendChild(b);
    });
    return box;
  }
  const opts = (prefix, keys) => keys.map(k => [k, LB[prefix + k]]);
  function row(label, hint, control, topic) {  // topic: id of the explanation card opened by clicking the label
    const r = el("div", "row"), q = el("div", "q", label);
    if (topic) { q.dataset.explain = topic; q.classList.add("explainable"); q.title = UI.row_tooltip; }
    if (hint) q.appendChild(el("span", "hint", hint));
    r.append(q, control); return r;
  }

  function renderControls() {
    const sit = cfg.situation; sit.textContent = "";
    sit.appendChild(row(UI["row.arrival"], null, seg(opts("arrival.", ["online", "offline"]), state.arrival,
      k => { state.arrival = k; changed(); }), "arrival"));
    if (state.arrival === "online") {
      sit.appendChild(row(UI["row.machines"], LB["busyhint." + state.busy], seg(opts("busy.", Object.keys(C.BUSY)), state.busy,
        k => { state.busy = k; if (k !== "Normal") state.tight = false; changed(); }), "machines"));
      sit.appendChild(row(UI["row.deadlines"], state.busy === "Normal" ? null : UI["hint.tight_only_normal"],
        seg(opts("deadline.", ["Normal", "Tight"]), state.tight ? "Tight" : "Normal", k => { state.tight = k === "Tight"; changed(); },
          state.busy === "Normal" ? [] : ["Tight"]), "deadlines"));
    } else {
      sit.appendChild(row(UI["row.deadlines"], null, seg(opts("deadlines.", Object.keys(C.DEADLINES)), state.deadlines, k => { state.deadlines = k; changed(); }), "deadlines"));
      sit.appendChild(row(UI["row.jobs"], null, seg(opts("jobs.", ["equal", "unequal"]), state.equal ? "equal" : "unequal", k => { state.equal = k === "equal"; changed(); }), "importance_jobs"));
    }
    cfg.examples.textContent = "";
    exampleNames.forEach(name => {
      const b = el("button", "chip", name); b.type = "button";
      b.onclick = () => { Object.keys(state.imp).forEach(k => { state.imp[k] = D.examples[name][k] || 0; }); changed(); };
      cfg.examples.appendChild(b);
    });
    cfg.factors.textContent = "";
    D.factors.forEach(f => {
      const t = TX.factors[f.key];
      cfg.factors.appendChild(row(t.label, t.hint, seg([0, 2, 5].map(v => [v, LB["level." + v]]), levelKey(state.imp[f.key]),
        v => { state.imp[f.key] = v; changed(); }), "f_" + f.key));
    });
  }

  // Lanes are built once per race and then moved: each lane is positioned by its current rank (leader on top) and slides
  // (CSS transition on transform) when another racer passes it. The starting order is random.
  let field = [], lastRes = null;
  function build(result) {
    lastRes = result;
    cfg.lanes.textContent = ""; cfg.lanes.style.setProperty("--n", result.racers.length);
    const order = result.racers.map((r, i) => ({ r, i, shuffle: Math.random() })).sort((a, b) => a.shuffle - b.shuffle);
    field = order.map((o, slot) => {
      const lane = el("div", "lane k-" + (o.r.family === "H" ? "rule" : o.r.kind));
      lane.innerHTML = cfg.laneHTML; lane.dataset.explain = "racer"; lane.dataset.idx = o.i; lane.title = UI.bar_tooltip;
      lane.querySelector(".t").textContent = o.r.title; lane.querySelector(".d").textContent = shortDetail(o.r.detail);
      lane.style.transform = "translateY(" + slot * 100 + "%)";
      cfg.lanes.appendChild(lane);
      return { r: o.r, lane, slot, p: 1.4 + Math.random() * 2.2 };  // p: this racer's own speed curve (higher = faster start)
    });
  }
  function progress(f, t) { return 1 - Math.pow(1 - t, f.p); }  // 0 at start, 1 at the finish for every racer
  function update(t) {
    const now = field.map(f => ({ f, w: f.r.percent * progress(f, t) }));
    now.forEach(x => { x.f.lane.querySelector(".pct").textContent = Math.round(x.w) + "%"; cfg.place(x.f.lane, x.w); });
    now.slice().sort((a, b) => b.w - a.w || a.f.slot - b.f.slot).forEach((x, rank) => { x.f.lane.style.transform = "translateY(" + rank * 100 + "%)"; });
  }
  function clearRace(msg) {
    field = []; cfg.lanes.textContent = ""; cfg.verdict.textContent = "";
    cfg.lanes.appendChild(el("div", "idle", msg));
  }

  function verdict(result) {
    cfg.verdict.textContent = "";
    if (!result.winner) { cfg.verdict.textContent = UI.nothing; return; }
    const w = result.winner, kind = w.family === "H" ? UI["kind.rule"] : UI["kind.ai"];
    cfg.verdict.append(el("b", null, fill(UI.winner, { title: w.title })), el("span", null, " - " + kind));
    if (result.note) cfg.verdict.appendChild(el("div", "note", result.note));
  }

  function current() { return C.run(C.presetFor(state), state.imp); }
  let finished = false;  // a finished race stays on screen until step 1 or 2 changes
  function changed() { running++; finished = false; lastRes = null; window.Explain.close(); renderControls(); clearRace(UI.idle); }  // any change to steps 1 or 2 resets the race

  function finish(res) {
    const w = field.find(f => f.r === res.winner);
    if (w) w.lane.classList.add("win");
    verdict(res); finished = true;
  }
  function start() {
    finished = false;
    const res = current(), id = ++running;
    if (!res.racers.length) { clearRace(UI.nothing); return; }
    build(res); cfg.verdict.textContent = "";
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { update(1); finish(res); return; }
    const t0 = performance.now(), dur = 4200;
    update(0);
    (function frame(now) {
      if (id !== running) return;
      const t = Math.min((now - t0) / dur, 1); update(t);
      if (t < 1) requestAnimationFrame(frame); else finish(res);
    })(t0);
  }

  // Boot (or re-boot after the page is updated in place): restore the choices and, if a race had finished, show its final result.
  function boot(data) {
    if (data && data.state) { Object.assign(state, data.state); }
    renderControls(); cfg.start.onclick = start;
    const res = current();
    if (data && data.finished && res.racers.length) { build(res); update(1); finish(res); } else clearRace(UI.idle);
  }
  // Clicking anything marked data-explain opens its card; a racer card gets that racer's numbers, the others the current race context.
  function context(target) {
    const res = lastRes || current();
    if (target.dataset.explain === "racer") return { racer: res.racers[+target.dataset.idx], ctx: res.ctx };
    return res.ctx;
  }
  window.RaceUI = { init(c) {
    cfg = c;
    document.querySelectorAll("[data-ui]").forEach(e => { e.textContent = UI[e.dataset.ui]; });  // static texts of the page template
    window.Explain.init(c.explain, () => context({ dataset: {} }));
    c.verdict.dataset.explain = "winner"; c.verdict.title = UI.winner_tooltip;
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-explain]");
      if (t && !t.closest(".seg") && !t.closest("#explain")) window.Explain.open(t.dataset.explain, context(t));
    });
    window.claude?.hot?.snapshot?.(() => ({ state: JSON.parse(JSON.stringify(state)), finished }));
    window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
  } };
})();

if (typeof RaceUI === "undefined") {  // this file is the template: the data and code are filled in by tools/analysis/make_demo_artifacts.py
  document.body.innerHTML = '<p style="font:18px sans-serif;padding:2rem">This is the page template, so it has no data. Open <b>app/web/dist/variant_a.html</b> instead (build it with <code>python tools/analysis/make_demo_artifacts.py</code>).</p>';
} else RaceUI.init({
  explain: document.getElementById("explain"), situation: document.getElementById("situation"), examples: document.getElementById("examples"), factors: document.getElementById("factors"),
  lanes: document.getElementById("lanes"), verdict: document.getElementById("verdict"), start: document.getElementById("go"),
  laneHTML: '<div class="top2"><div><div class="t"></div><div class="d"></div></div><div class="pct"></div></div><div class="track"><div class="fill"></div></div>',
  place(lane, w) { lane.querySelector(".fill").style.width = w + "%"; }
});
</script>
